<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이보람 김포점 문법</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D6EBFF">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IBG Grammar">
<style>
:root{--okbg:#c9f7d4;--ink:#16233b;--bg:#f3f6fb;--card:#fff;--line:#d9e0ec;--acc:#2f6bff;--accT:#fff;--ok:#1f9d6b;--no:#d64550;--hl:#ffe58a;--mut:#667189}
@media (prefers-color-scheme:dark){:root{--okbg:#1f5a3a;--ink:#e8edf7;--bg:#10141d;--card:#1a2130;--line:#2e384d;--acc:#6c93ff;--accT:#0c1220;--ok:#4fd1a0;--no:#ff7b84;--hl:#5b4a12;--mut:#9aa6bf}}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:12px 14px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.narrow{max-width:380px;margin:12vh auto}
h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:4px 0 12px;line-height:1.4}
.muted{color:var(--mut);font-size:14px}.err{color:var(--no);min-height:1.4em;margin:8px 0 0}
input,select{width:100%;font:inherit;padding:11px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accT);font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.link{background:none;border:0;color:var(--acc);padding:0 4px;text-decoration:underline}
.steps{display:grid;gap:8px;margin:14px 0 4px}
.step{display:flex;justify-content:space-between;text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.step.done{border-color:var(--ok)}.step.done::after{content:"✔ 완료";color:var(--ok);font-weight:700}
.video{position:relative;padding-top:56.25%;margin:10px 0;border-radius:10px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.q{font-size:19px;line-height:1.6;margin:6px 0 14px}
.slot{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:17px}
.chip.on{background:var(--hl)}
.sub.rvb{font-weight:700;color:var(--acc)}
.nbt{display:flex;gap:8px;margin:8px 0}.nbt .btn{flex:1;margin:0;padding:10px 6px;font-size:14px}
.nbq .tag{font-size:12px;color:var(--mut)}.nbq .done{color:var(--ok);font-weight:700}
.lh{margin:14px 2px 4px;font-weight:700}
.rvw{border-top:1px solid var(--line);padding-top:8px;margin-top:10px;font-size:15px}
.chip{transition:opacity .15s,background .15s}.chip.used{background:var(--line);color:var(--mut);opacity:.45;text-decoration:line-through}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr.off{opacity:.5}.act button{margin-right:4px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.lay{display:grid;grid-template-columns:310px 1fr;gap:14px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;max-height:calc(100vh - 80px);overflow:auto;position:sticky;top:8px}
.un{width:100%;display:flex;justify-content:space-between;gap:8px;padding:11px 12px;margin-top:6px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font-weight:700;text-align:left}
.sub{display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:14px}
.sub.cur{background:var(--hl)}.sub b{color:var(--acc);white-space:nowrap}
.vwrap{display:flex;flex-direction:column;background:#000;border-radius:10px;overflow:hidden}
.vwrap iframe{width:100%;aspect-ratio:16/9;border:0}
.vbar{display:flex;gap:8px;padding:8px;background:var(--card)}.vbar .btn{margin:0}
.vwrap:fullscreen{border-radius:0}.vwrap:fullscreen iframe{flex:1;aspect-ratio:auto;min-height:0}
.note{font-size:17px;line-height:2.5}.bl{display:inline-flex;align-items:center;gap:4px;margin:0 3px}
.bl input{width:auto;margin:0;padding:3px 8px;text-align:center;border-bottom:2px solid var(--acc)}.bl input.good{border-color:var(--ok);color:var(--ok)}
.hint{font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.hint:disabled{opacity:.5}
.ans{color:var(--no);font-size:14px}
@media(max-width:820px){.lay{grid-template-columns:1fr}.side{position:static;max-height:42vh}}
.tw{display:grid;grid-template-columns:1fr 370px;gap:12px;align-items:start}
.rkbox{position:sticky;top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.rk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.rkr{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:6px}.rkr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rkr.me{background:var(--hl)}
.srow{position:relative;padding:12px 46px 12px 12px;border:1px solid var(--line);border-radius:10px;margin:10px 0;transition:background .3s,border-color .3s}
.srow .ko{font-size:15px;margin-bottom:6px}.srow .pool{margin-bottom:6px}.srow .chip{padding:3px 10px;font-size:15px}
.mir{min-height:30px;font-size:18px;font-weight:700;padding:2px 4px;border-bottom:2px solid var(--line);margin-bottom:6px;word-break:break-all}
.sin{margin:0;font-size:17px}
.srow .tick{display:none;position:absolute;right:12px;top:12px;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:#2ecc71;color:#fff;font-size:18px}
.srow.ok{background:var(--okbg);border-color:#2ecc71}.srow.ok .tick{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--card);border-radius:14px;padding:16px;max-height:80vh;overflow:auto;width:min(92vw,420px)}
.exp{background:var(--bg);border-left:4px solid var(--acc);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:15px}
.rv{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
@media not all and (min-width:1025px) and (hover:hover) and (pointer:fine){.tw{grid-template-columns:1fr}.rkbox{display:none}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.seg button{flex:1;min-width:70px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px}
.seg button.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:700}
.units{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0 12px}.un8{display:flex;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}.un8.off{opacity:.45}
.un8 input{width:auto;margin:0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2 .btn{margin-top:10px}
.exbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:12px}
.exq .q{font-size:16px;line-height:1.6;white-space:pre-wrap}.pass{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px;line-height:1.7}
.ch{display:block;width:100%;text-align:left;padding:11px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);white-space:pre-wrap;line-height:1.5}.ch.on{background:var(--hl);border-color:var(--acc);font-weight:700}
.tag{display:inline-block;padding:2px 8px;margin:2px 2px 2px 0;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.big{font-size:34px;font-weight:800;margin:6px 0}.big small{font-size:16px;font-weight:400;color:var(--mut)}
.rc{padding:8px 10px;margin:4px 0;border-radius:8px;border:1px solid var(--line);white-space:pre-wrap}.rc.good{background:var(--okbg,#c9f7d4);border-color:#2ecc71}.rc.bad{border-color:var(--no)}
.paper{background:#fff;color:#000;padding:16px 18px;font-size:14px;line-height:1.5;border:1px solid var(--line);border-radius:8px}
.paper .ph{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:12px}
.pq.c2{column-count:2;column-gap:28px;column-rule:1px solid #bbb}
.pi{break-inside:avoid;margin:0 0 14px}.pi p{margin:0 0 4px}
.pp{border:1px solid #000;padding:6px 8px;margin:4px 0 6px;font-size:13.5px}.pc{margin:1px 0}
.pk{break-before:page;page-break-before:always;margin-top:24px}
.pans{display:grid;grid-template-columns:repeat(5,1fr);gap:4px 8px;margin-bottom:12px}.pex{margin:3px 0;font-size:13px}
.bar2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.bar2 .btn{margin-top:0}
@media screen and (max-width:700px){.pq.c2{column-count:1}}
@media print{.noprint{display:none!important}body{background:#fff}#app{max-width:none;padding:0}.paper{border:0;padding:0}@page{margin:12mm}}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin:12px 0}
.rbtn{padding:12px 6px;border:1px solid var(--acc);border-radius:10px;background:var(--bg);font-weight:700;color:var(--acc)}
.rbtn.done{background:#9aa0ab;border-color:#9aa0ab;color:#fff}
.bar .ttl{cursor:pointer}
.bar>span{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px}
.bar .link{padding:6px 13px;border-radius:999px;border:1px solid var(--acc);background:var(--card);color:var(--acc);text-decoration:none;font-size:13px;font-weight:600;line-height:1.25;white-space:nowrap;cursor:pointer}
.bar .link:hover{background:var(--acc);color:var(--accT)}
.bar .link:last-child{border-color:var(--line);color:var(--mut)}
.bar .link:last-child:hover{background:var(--line);color:var(--ink)}
@media(max-width:560px){.bar{flex-wrap:wrap}.bar .link{padding:5px 10px;font-size:12px}}
.gboard{display:none}
@media (min-width:1025px) and (hover:hover) and (pointer:fine){.gboard{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}}
/* 문장 입력 화면도 영상 화면과 같은 자리(좌우)에 순위표를 보여줘요 */
.tw{display:block}.rkbox{display:none!important}
/* 왼쪽 메뉴: 영상·문장·퀴즈 단계 버튼 */
.sub{flex-direction:column;align-items:stretch;cursor:pointer}.sub .t1{display:flex;justify-content:space-between;gap:8px}
.stps{display:flex;gap:4px;margin-top:5px}
.stp{padding:2px 9px;font-size:12px;border:1px solid var(--acc);border-radius:999px;background:var(--card);color:var(--acc);font-weight:700}
.stp.done{border-color:var(--line);background:var(--line);color:var(--mut);font-weight:400}
@media (min-width:1540px) and (hover:hover) and (pointer:fine){.gboard{display:block;margin:0}.gboard .rk{position:fixed;top:72px;width:190px;max-height:calc(100vh - 90px);overflow:auto}
.gboard .rk:nth-child(1){left:calc(50% - 754px)}.gboard .rk:nth-child(2){right:calc(50% - 754px)}}
</style>

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SITE = "아이보람 김포점 문법";
const SB_URL = "https://anzdgisybvlxxusspfom.supabase.co";
const SB_KEY = "sb_publishable_ZozBAhHUaGdxcQu9YGttUA_1-2IdGgE";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const html = h => { $("#app").innerHTML = h; window.scrollTo(0, 0); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = d => d ? new Date(d).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "-";
const need = r => { if (r.error) { alert("문제가 생겼어요: " + r.error.message); return null; } return r.data; };
let me = null, lessons = [], R = [];
/* 학습 화면 잠금: 새로고침/탭 닫기/뒤로가기 경고 (강의명 클릭·나가기 버튼은 화면 전환이라 영향 없음) */
let lock = false;
function setLock(on) {
  lock = on;
  if (on && !history.state?.lk) { history.replaceState({ lk: 1 }, ""); history.pushState({ lk: 2 }, ""); }
}
window.addEventListener("beforeunload", e => { if (lock) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("popstate", () => { if (lock) history.pushState({ lk: 2 }, ""); });
window.addEventListener("keydown", e => {
  if (lock && (e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r"))) {
    if (!confirm("새로고침하면 입력한 내용이 사라져요. 계속할까요?")) e.preventDefault();
  }
});

const hdr = () => `<div class="bar"><b class="ttl" onclick="goHome()">${SITE}</b><span>${esc(me.name)} ${me.role === "admin" ? `<button class="link" onclick="examHome()">🖨 내신 시험지</button> ` : `<button class="link" onclick="notebook()">📒 My Grammar</button> <button class="link" onclick="examHome()">📝 내신 준비</button> `}<button class="link" onclick="logout()">로그아웃</button></span></div>`;
function goHome() {
  if (me.role === "admin") { if (confirm("관리자 화면으로 이동할까요?")) adminView(); return; }
  if (confirm("문법 강의 화면으로 이동할까요?\n(진행 중인 강의로 이동해요)")) lessonView();
}
async function logout() { setLock(false); await sb.auth.signOut(); me = null; loginView(); }

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  session ? loadMe() : loginView();
}

async function loadMe() {
  const { data: { user } } = await sb.auth.getUser();
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if (error || !data || !data.active) { await sb.auth.signOut(); return loginView("사용할 수 없는 계정이에요. 선생님께 문의하세요."); }
  me = data;
  const l = await sb.from("lessons").select("lesson_no,unit,title,embed_url").order("lesson_no");
  lessons = l.data || [];
  me.role === "admin" ? adminView() : lessonView();
}

function loginView(msg = "") {
  setLock(false);
  html(`<div class="card narrow"><h1>${SITE}</h1><p class="muted">선생님이 알려준 아이디와 비밀번호를 입력하세요.</p>
    <input id="u" placeholder="아이디" autocapitalize="none" autocomplete="username">
    <input id="p" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" id="go">로그인</button><p class="err">${esc(msg)}</p></div>`);
  const go = async () => {
    const u = $("#u").value.trim().toLowerCase(), p = $("#p").value;
    if (!u || !p) return;
    $("#go").disabled = true;
    const email = u.includes("@") ? u : u + "@student.example.com";
    const { error } = await sb.auth.signInWithPassword({ email, password: p });
    if (error) return loginView("아이디 또는 비밀번호가 맞지 않아요.");
    loadMe();
  };
  $("#go").onclick = go;
  $("#p").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ---------- 학생 화면 ---------- */
const UN=["명사와 관사","인칭대명사","be동사와 일반동사","형용사","부사","be동사 과거","일반동사 과거","미래시제","진행시제","조동사","비교급과 최상급","전치사","접속사","의문사","명령문과 제안문","문장의 형식","현재완료와 조동사 표현","수동태","가정법","to부정사","동명사","분사","부사절과 분사구문","관계대명사","관계부사"];
let prog = {}, openU = 0, cur = 0, tick = 0;
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, "");
const CH = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho = s => [...s.replace(/[A-Za-z]+/g, w => w[0] + "○".repeat(w.length - 1))].map(c => { const n = c.charCodeAt(0) - 44032; return n >= 0 && n < 11172 ? CH[n / 588 | 0] : c; }).join("");
const mainHtml = h => { clearInterval(tick); $("#main").innerHTML = h; };
/* 단계 기록: steps[강번호] = { video, sentence, quiz } */
let steps = {};
const STP = [["video", "영상"], ["sentence", "문장"], ["quiz", "퀴즈"]];
const allDone = no => STP.every(([k]) => steps[no] && steps[no][k]);
async function markStep(no, k) {
  steps[no] = steps[no] || {};
  if (steps[no][k]) return;
  steps[no][k] = true;
  await sb.from("lesson_steps").upsert({ student_id: me.id, lesson_no: no, step: k }, { onConflict: "student_id,lesson_no,step", ignoreDuplicates: true });
  if (allDone(no) && !prog[no]) {
    need(await sb.rpc("save_progress", { p_lesson: no, p_step: "note" }));
    need(await sb.rpc("save_progress", { p_lesson: no, p_step: "practice" }));
    prog[no] = true;
  }
  drawSide();
}
/* 왼쪽 메뉴의 단계 버튼에서 바로 이동 */
function openStep(e, no, k) {
  e.stopPropagation();
  if (k === "video") return go(no);
  cur = no; openU = lessons.find(x => x.lesson_no == no).unit; drawSide();
  k === "sentence" ? typeStep(no) : quizStep(no);
}
async function getQs(no, step) { return need(await sb.rpc("get_questions", { p_lesson: no, p_step: step })) || []; }

function sideHtml() {
  const by = {}; lessons.forEach(l => (by[l.unit] = by[l.unit] || []).push(l));
  return Object.keys(by).map(u => {
    const a = by[u], d = a.filter(l => prog[l.lesson_no]).length;
    return `<button class="un" onclick="openU=${openU == u ? 0 : u};drawSide()"><span>${u}. ${UN[u - 1] || "단원"}</span><small>${Math.round(100 * d / a.length)}%</small></button>` +
      (openU == u ? a.map(l => { const n = l.lesson_no, s = steps[n] || {};

async function noteStep(no) {
  const { data } = await sb.from("notes").select("body").eq("lesson_no", no).maybeSingle();
  if (!data) { markStep(no, "video"); return typeStep(no); }
  const it = [];
  const body = data.body.split(/\{\{(.*?)\}\}/).map((t, k) => {
    if (k % 2 == 0) return esc(t).replace(/\n/g, "<br>");
    const i = it.push({ a: t.trim(), t0: 0, th: 0, ok: 0 }) - 1;
    return `<span class="bl"><input data-i="${i}" size="${Math.max(4, t.trim().length + 1)}" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="hint" data-h="${i}" disabled>힌트(10)</button><span class="ans" id="x${i}"></span></span>`;
  }).join("");
  mainHtml(`<div class="card"><div class="muted">요점정리노트 · 괄호를 채워 보세요</div><div class="note">${body}</div><button class="btn" id="nxt" disabled>다음: 문장 입력하기</button></div>`);
  const hs = document.querySelectorAll(".hint");
  document.querySelectorAll(".bl input").forEach(el => {
    const i = el.dataset.i, x = it[i];
    el.onfocus = () => { if (!x.t0) x.t0 = Date.now(); };
    el.oninput = () => {
      if (norm(el.value) !== norm(x.a)) return;
      x.ok = 1; el.classList.add("good"); el.disabled = true; $("#x" + i).textContent = ""; hs[i].hidden = true;
      if (it.every(y => y.ok)) { $("#nxt").disabled = false; markStep(no, "video"); }
    };
  });
  hs.forEach(b => b.onclick = () => {
    const x = it[b.dataset.h], o = $("#x" + b.dataset.h);
    if (!x.th) { x.th = Date.now(); o.textContent = "초성: " + cho(x.a); }
    else { o.textContent = "정답: " + x.a; b.hidden = true; }
  });
  tick = setInterval(() => {
    const now = Date.now();
    it.forEach((x, i) => {
      const b = hs[i]; if (x.ok || b.hidden) return;
      if (!x.th) { const s = x.t0 ? 10 - Math.floor((now - x.t0) / 1000) : 10; b.disabled = s > 0; b.textContent = s > 0 ? `힌트(${s})` : "힌트보기"; }
      else { const s = 10 - Math.floor((now - x.th) / 1000); b.disabled = s > 0; b.textContent = s > 0 ? `정답보기(${s})` : "정답보기"; }
    });
  }, 500);
  $("#nxt").onclick = () => typeStep(no);
}

function ding() {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain(), t = _ac.currentTime;
    o.type = "sine"; o.frequency.value = 330; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

  } catch (e) {}
}

function scramble(ans) {
  const w = ans.replace(/[.?!]+$/, "").split(" ");
  let r = shuffle([...w]); for (let t = 0; t < 6 && w.length > 1 && r.join(" ") === w.join(" "); t++) r = shuffle([...w]);

}

async function typeStep(no) {

  const putD = v => { try { v ? localStorage.setItem(dkey, JSON.stringify(v)) : localStorage.removeItem(dkey); } catch (e) {} };

    const items = d && d.ids ? d.ids.map(id => sents.find(x => x.id == id)).filter(Boolean) : sents.slice(pg * PAGE, pg * PAGE + PAGE); let done = 0;

      ${items.map((x, i) => `<div class="srow" id="r${i}"><div class="ko">${i + 1}. ${esc(x.prompt)}</div>
        <div class="pool">${scramble(x.answer).map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>
        <div class="mir" id="m${i}"></div>
        <input class="sin" id="in${i}" placeholder="여기에 입력하세요" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">

      <div class="row2"><button class="btn ghost" id="sv">💾 임시저장</button><button class="btn" id="fin" disabled>제출하기</button></div></div></div>`);
    gbRefresh(false);
    const saveD = () => {
      const dn = [], ty = {};
      items.forEach((x, i) => { const inp = $("#in" + i); if (!inp) return; if ($("#r" + i).classList.contains("ok")) dn.push(x.id); else if (inp.value) ty[x.id] = inp.value; });
      putD({ pg, ids: items.map(x => x.id), done: dn, typed: ty });
    };
    items.forEach((x, i) => {
      const T = x.answer.trim(), body = T.replace(/[.?!]+$/, "");
      const inp = $("#in" + i), mir = $("#m" + i), row = $("#r" + i); let fin = false;
      const eq = (a, b) => a.replace(/[’‘]/g, "'").toLowerCase() === b.toLowerCase();
      const chips = [...row.querySelectorAll(".chip")], ws = body.split(" "); let c = 0;
      const ends = ws.map(w => (c += w.length, c++ , c - 1));
      const grey = j => {
        chips.forEach(ch => ch.classList.remove("used"));
        ws.forEach((w, k) => {
          if (j < ends[k]) return;
          const free = chips.filter(h => !h.classList.contains("used"));
          const ch = free.find(h => h.textContent === w) || free.find(h => h.textContent.toLowerCase() === w.toLowerCase());
          if (ch) ch.classList.add("used");
        });
      };
      const complete = rec => {
        fin = true; mir.textContent = T; inp.value = T; inp.disabled = true; row.classList.add("ok"); done++; grey(body.length);
        $("#cnt").textContent = done;
        if (rec) {
          sb.rpc("record_sentence", { p_question: x.id }).then(r => { if (typeof r.data === "number" && r.data >= 0) setMine(r.data); });
          saveD();

        }
        if (done === items.length) { $("#fin").disabled = false; if (rec) $("#fin").scrollIntoView({ block: "center", behavior: "smooth" }); }
      };
      inp.oninput = () => {
        if (fin) return;
        const v = inp.value; let j = 0;
        while (j < v.length && j < body.length && eq(v[j], body[j])) j++;
        if (j < v.length) ding();
        inp.value = body.slice(0, j); mir.textContent = body.slice(0, j); grey(j);
        if (j === body.length) complete(true);
      };
      if (d && (d.done || []).includes(x.id)) complete(false);
      else if (d && d.typed && d.typed[x.id]) { inp.value = d.typed[x.id]; inp.oninput(); }

    };

      <button class="btn ${has ? "ghost" : ""}" id="quiz">문제 풀러 가기</button></div></div>`);
    if (has) $("#more").onclick = () => showPage(pg + 1);

  };

}

async function quizStep(no) {
  const qs = shuffle(await getQs(no, "quiz")).slice(0, 10); let i = 0, right = 0; const wrong = [];
  const review = () => {
    mainHtml(`<div class="card"><h2>틀린 문제 풀이</h2><p class="muted">${qs.length}문제 중 ${right}개 맞았어요. 틀린 문제를 확인해 보세요.</p>
      ${wrong.map((w, k) => `<div class="rv"><p class="q">${k + 1}. ${esc(w.p)}</p><p class="no">내 답: ${esc(w.mine)}</p><p class="ok">정답: ${esc(w.ans)}</p>${w.exp ? `<div class="exp">💡 ${esc(w.exp)}</div>` : ""}</div>`).join("")}
      <button class="btn" id="done">학습 완료하기</button></div>`);
    $("#done").onclick = () => finish(no, right, qs.length);
  };
  const show = () => {
    if (i >= qs.length) return wrong.length ? review() : finish(no, right, qs.length);
    const q = qs[i];
    mainHtml(`<div class="card"><div class="muted">퀴즈 · ${i + 1} / ${qs.length}</div><p class="q">${esc(q.prompt)}</p>
      ${shuffle([...(q.choices || [])]).map((c, k) => `<button class="choice" data-c="${esc(c)}">${"①②③④⑤"[k]} ${esc(c)}</button>`).join("")}<div id="fb"></div></div>`);
    const all = document.querySelectorAll(".choice");
    all.forEach(b => b.onclick = async () => {
      all.forEach(x => x.disabled = true);
      const d = need(await sb.rpc("submit_answer", { p_question: q.id, p_answer: b.dataset.c }));
      if (!d) { all.forEach(x => x.disabled = false); return; }
      const r = d[0];
      if (r.is_correct) right++; else wrong.push({ p: q.prompt, mine: b.dataset.c, ans: r.correct_answer, exp: r.explanation });
      all.forEach(x => { if (x.dataset.c === r.correct_answer) x.style.borderColor = "var(--ok)"; });
      if (!r.is_correct) b.style.borderColor = "var(--no)";
      $("#fb").innerHTML = `<p class="${r.is_correct ? "ok" : "no"}">${r.is_correct ? "정답이에요! 👍" : "아쉬워요. 정답: " + esc(r.correct_answer)}</p>
        ${!r.is_correct && r.explanation ? `<div class="exp">💡 풀이: ${esc(r.explanation)}</div>` : ""}
        <button class="btn" id="nx">${i + 1 < qs.length ? "다음 문제" : (wrong.length ? "틀린 문제 풀이 보기" : "결과 보기")}</button>`;
      $("#nx").onclick = () => { i++; show(); };
    });
  };
  show();
}

async function finish(no, right, n) {
  await markStep(no, "quiz"); gbRefresh(true);
  const score = n ? `<p>퀴즈 ${n}문제 중 <b>${right}</b>개 맞았어요.</p>` : "";
  if (!allDone(no)) {
    /* 아직 남은 단계가 있으면 그 단계로 안내 */
    const left = STP.filter(([k]) => !steps[no][k]);
    mainHtml(`<div class="card"><h2>퀴즈 완료! 👍</h2>${score}<p class="muted">학습완료까지 남은 단계: <b>${left.map(x => x[1]).join(", ")}</b></p>

  }
  const nx = lessons.find(l => l.lesson_no > no);
  const card = `<div class="card"><h2>🎉 학습완료!</h2>${score}${nx ? `<p class="muted">다음 강의 영상이 준비됐어요.</p>` : `<p class="ok">마지막 강의까지 모두 마쳤어요!</p>`}</div>`;
  if (nx) { cur = nx.lesson_no; openU = nx.unit; drawSide(); mainHtml(card + vid(nx)); wire(nx.lesson_no); }
  else { drawSide(); mainHtml(card); }
  window.scrollTo(0, 0);
}

function nbCard(x) {
  return `<div class="card nbq"><div class="tag">${x.lesson_no ? x.lesson_no + "강 · " : ""}${nbKind(x)} · 틀린 횟수 ${x.wrong_count}번 · 마지막 ${nbDate(x.last_at)}${x.solved ? ` · <span class="done">✔ 해결</span>` : ""}</div>
    <p class="q">${esc(x.prompt)}</p>
    ${x.my_answer ? `<div class="no">내 답: ${esc(x.my_answer)}</div>` : ""}<div class="ok">정답: ${esc(x.correct_answer)}</div>
    ${x.explanation ? `<div class="exp">${esc(x.explanation)}</div>` : ""}</div>`;
}
function nbDraw() {
  const open = NB.filter(x => !x.solved), done = NB.filter(x => x.solved), list = nbTab === "open" ? open : done;
  const tabs = `<div class="nbt"><button class="btn ${nbTab === "open" ? "" : "ghost"}" onclick="nbTab='open';nbUnit=0;nbDraw()">아직 못 맞힌 문제 (${open.length})</button><button class="btn ${nbTab === "done" ? "" : "ghost"}" onclick="nbTab='done';nbUnit=0;nbDraw()">해결한 문제 (${done.length})</button></div>`;
  let body = "";
  if (!nbUnit) {
    const by = {}; list.forEach(x => { const u = x.unit || 0; by[u] = (by[u] || 0) + 1; });
    const us = Object.keys(by).map(Number).sort((a, b) => a - b);
    body = us.length ? `<p class="muted">단원을 눌러 문제를 다시 확인해요.</p>` + us.map(u => `<button class="choice" onclick="nbUnit=${u};nbDraw()"><b>${u ? u + ". " + esc(UN[u - 1] || "단원") : "기타"}</b> · ${by[u]}문제</button>`).join("")
      : `<div class="card">${nbTab === "open" ? "틀린 문제가 없어요. 대단해요! 👏" : "아직 해결한 문제가 없어요."}</div>`;
  } else {
    const items = list.filter(x => (x.unit || 0) === nbUnit);
    const srt = [...items].sort(nbSort === "recent" ? (a, b) => new Date(b.last_at) - new Date(a.last_at) : (a, b) => (a.lesson_no || 0) - (b.lesson_no || 0) || new Date(b.last_at) - new Date(a.last_at));
    let cards = "";
    if (nbSort === "lesson") { let last = -1; srt.forEach(x => { if (x.lesson_no !== last) { last = x.lesson_no; cards += `<div class="lh">${x.lesson_no ? x.lesson_no + "강" : "기타"}</div>`; } cards += nbCard(x); }); }
    else cards = srt.map(nbCard).join("");
    const canRetry = nbTab === "open" && items.some(x => x.src === "quiz" && x.step === "quiz");
    body = `<button class="link" onclick="nbUnit=0;nbDraw()">← 단원 목록</button><h3>${nbUnit}. ${esc(UN[nbUnit - 1] || "")} · ${items.length}문제</h3>
      <div class="nbt"><button class="btn ${nbSort === "recent" ? "" : "ghost"}" onclick="nbSort='recent';nbDraw()">최근 틀린 순</button><button class="btn ${nbSort === "lesson" ? "" : "ghost"}" onclick="nbSort='lesson';nbDraw()">강의 번호순</button></div>
      ${canRetry ? `<button class="btn" onclick="nbRetry(${nbUnit})">이 단원 오답 다시 풀기</button>` : ""}${cards}`;
  }
  mainHtml(`<div class="card"><h2>📒 My Grammar</h2><p class="muted">내가 틀렸던 문제를 단원별로 모아 봤어요.</p></div>${tabs}${body}`);
}
async function nbRetry(u) {
  const w = need(await sb.rpc("get_review_wrong", { p_unit: u, p_limit: 10 })) || [];
  if (!w.length) { alert("다시 풀 퀴즈 오답이 없어요."); return; }
  reviewWrong(u, w);
}

async function reviewIntro(u) {
  cur = 0; openU = u; drawSide();
  const sets = need(await sb.rpc("get_review_sets", { p_unit: u })) || [];
  const left = lessons.filter(l => l.unit == u && !prog[l.lesson_no]).map(l => l.lesson_no);
  const note = left.length ? `<p class="muted">💡 아직 학습완료하지 않은 강의가 <b>${left.length}</b>개 있어요${left.length <= 6 ? " (" + left.join(", ") + "강)" : ""}. 강의를 다 마친 뒤에 풀면 더 좋지만, 지금 풀어 봐도 괜찮아요.</p>` : "";
  mainHtml(`<div class="card"><h2>📝 Review Test · ${u}단원 ${esc(UN[u - 1] || "")}</h2>${note}
    <p class="muted">1회~4회 중에 골라서 풀어요. 한 회는 25문제이고, 문제 순서는 풀 때마다 바뀌어요. 시간 제한은 없어요.</p>
    ${sets.map(s => `<button class="choice" onclick="reviewMain(${u},${s.set_no})"><b>${s.set_no}회</b> · ${s.total}문제 · ${s.tried ? "맞힌 문제 " + s.right_cnt + " / " + s.total : "아직 안 풀었어요"}</button>`).join("") || `<p>아직 이 단원의 Review 문제가 없어요.</p>`}</div>`);
  window.scrollTo(0, 0);
}

async function reviewWrong(u, qs) {
  let i = 0, fixed = 0;
  const show = () => {
    if (i >= qs.length) {
      mainHtml(`<div class="card"><h2>오답 복습 끝! 👍</h2><p>${qs.length}문제 중 <b>${fixed}</b>개를 이번에 맞혔어요.</p><button class="btn" id="go2">My Grammar로 돌아가기</button></div>`);
      $("#go2").onclick = () => notebook(); return;
    }
    const q = qs[i];
    mainHtml(`<div class="card"><div class="muted">오답 복습 · ${i + 1} / ${qs.length}</div><p class="q">${esc(q.prompt)}</p>
      ${shuffle([...(q.choices || [])]).map((c, k) => `<button class="choice" data-c="${esc(c)}">${"①②③④⑤"[k]} ${esc(c)}</button>`).join("")}<div id="fb"></div></div>`);
    const all = document.querySelectorAll(".choice");
    all.forEach(b => b.onclick = async () => {
      all.forEach(x => x.disabled = true);
      const d = need(await sb.rpc("submit_answer", { p_question: q.id, p_answer: b.dataset.c }));
      if (!d) { all.forEach(x => x.disabled = false); return; }
      const r = d[0]; if (r.is_correct) fixed++;
      b.style.borderColor = r.is_correct ? "var(--ok)" : "var(--no)";
      $("#fb").innerHTML = `<p class="${r.is_correct ? "ok" : "no"}">${r.is_correct ? "정답이에요! 👍" : "아쉬워요. 정답: " + esc(r.correct_answer)}</p><button class="btn" id="nx">${i + 1 < qs.length ? "다음 문제" : "복습 마치기"}</button>`;
      $("#nx").onclick = () => { i++; show(); };
    });
    window.scrollTo(0, 0);
  };
  show();
}

async function reviewMain(u, set) {
  const qs = need(await sb.rpc("get_review_questions", { p_unit: u, p_set: set })) || [];
  if (!qs.length) { mainHtml(`<div class="card">아직 이 회차의 Review 문제가 없어요.</div>`); return; }
  let i = 0, right = 0; const wrong = [];
  const show = () => {
    if (i >= qs.length) {
      mainHtml(`<div class="card"><h2>🎉 ${set}회 완료!</h2><p>${qs.length}문제 중 <b>${right}</b>개 맞았어요.</p>
        ${wrong.length ? `<h3>틀린 문제</h3>` + wrong.map(w => `<div class="rv"><div>${esc(w.prompt)}</div><div class="no">내 답: ${esc(w.mine)}</div><div class="ok">정답: ${esc(w.ans)}</div>${w.exp ? `<div class="exp">${esc(w.exp)}</div>` : ""}</div>`).join("") : `<p class="ok">전부 맞혔어요! 완벽해요 👏</p>`}
        <button class="btn" id="again">${set}회 다시 도전하기</button> <button class="btn ghost" id="pick">회차 선택으로</button></div>`);
      $("#again").onclick = () => reviewMain(u, set); $("#pick").onclick = () => reviewIntro(u); window.scrollTo(0, 0); return;
    }
    const q = qs[i];
    mainHtml(`<div class="card"><div class="muted">Review Test · ${u}단원 · ${set}회 · ${i + 1} / ${qs.length}</div><p class="q">${esc(q.prompt)}</p>
      ${shuffle([...(q.choices || [])]).map((c, k) => `<button class="choice" data-c="${esc(c)}">${"①②③④⑤"[k]} ${esc(c)}</button>`).join("")}<div id="fb"></div></div>`);
    const all = document.querySelectorAll(".choice");
    all.forEach(b => b.onclick = async () => {
      all.forEach(x => x.disabled = true);
      const d = need(await sb.rpc("submit_review_answer", { p_question: q.id, p_answer: b.dataset.c }));
      if (!d) { all.forEach(x => x.disabled = false); return; }
      const r = d[0];
      if (r.is_correct) right++; else wrong.push({ prompt: q.prompt, mine: b.dataset.c, ans: r.correct_answer, exp: r.explanation });
      b.style.borderColor = r.is_correct ? "var(--ok)" : "var(--no)";
      $("#fb").innerHTML = `<p class="${r.is_correct ? "ok" : "no"}">${r.is_correct ? "정답이에요! 👍" : "아쉬워요. 정답: " + esc(r.correct_answer)}</p>${r.explanation ? `<div class="exp">${esc(r.explanation)}</div>` : ""}<button class="btn" id="nx">${i + 1 < qs.length ? "다음 문제" : "결과 보기"}</button>`;
      $("#nx").onclick = () => { i++; show(); };
    });
    window.scrollTo(0, 0);
  };
  show();
}

/* ---------- 중학 내신 준비 ---------- */
let TB = [], exSt = { tb: 0, grade: 1, sem: 0, units: [1, 2] }, exCnt = {};
const EXSEM = ["1학기 중간", "1학기 기말", "2학기 중간", "2학기 기말"];
const exDef = s => [2 * s + 1, 2 * s + 2];
const exNum = "①②③④⑤";

async function examHome() {
  setLock(false);
  if (!TB.length) {
    const r = await sb.from("textbooks").select("*").order("sort_no"); TB = r.data || [];
    if (!TB.length) return alert("교과서 목록이 아직 준비되지 않았어요. 선생님께 문의하세요.");
  }
  if (!exSt.tb) exSt.tb = TB[0].id;
  await exLoadCnt(); exDraw();
}
async function exLoadCnt() {
  const r = await sb.rpc("exam_units", { p_textbook: exSt.tb, p_grade: exSt.grade });
  exCnt = {}; (r.data || []).forEach(x => exCnt[x.unit_no] = x.n);
  exSt.units = exSt.units.filter(u => exCnt[u]);
}
function exDraw() {
  html(hdr() + `<div class="card"><h2>📝 중학 내신 준비</h2>
    <div class="muted">교과서</div>
    <select id="extb">${TB.map(t => `<option value="${t.id}" ${t.id == exSt.tb ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select>
    <div class="muted" style="margin-top:8px">학년</div>
    <div class="seg">${[1, 2, 3].map(g => `<button class="${g == exSt.grade ? "on" : ""}" data-g="${g}">${g}학년</button>`).join("")}</div>
    <div class="muted" style="margin-top:8px">시험</div>
    <div class="seg">${EXSEM.map((t, i) => `<button class="${i == exSt.sem ? "on" : ""}" data-s="${i}">${t}</button>`).join("")}</div>
    <div class="muted" style="margin-top:8px">시험 범위 <small>(학교 범위에 맞게 단원을 더 체크하세요)</small></div>
    <div class="units">${[1, 2, 3, 4, 5, 6, 7, 8].map(u => `<label class="un8 ${exCnt[u] ? "" : "off"}"><input type="checkbox" data-u="${u}" ${exSt.units.includes(u) ? "checked" : ""} ${exCnt[u] ? "" : "disabled"}> Lesson ${u}${exCnt[u] ? "" : " <small>(준비중)</small>"}</label>`).join("")}</div>
    ${me.role === "admin" ? "" : `<button class="btn" id="exgo">시험 시작 (25문항)</button>`}
    <button class="btn ${me.role === "admin" ? "" : "ghost"}" id="expt">🖨 시험지 출력</button>
    ${me.role === "admin" ? "" : `<div class="row2"><button class="btn ghost" onclick="examWrong()">📕 오답노트</button><button class="btn ghost" onclick="examHistory()">📊 응시 기록</button></div>`}
    <button class="btn ghost" onclick="${me.role === "admin" ? "adminView()" : "lessonView()"}">${me.role === "admin" ? "← 관리자 화면으로" : "← 문법 강의로"}</button></div>`);
  $("#extb").onchange = async e => { exSt.tb = +e.target.value; await exLoadCnt(); exSt.units = exDef(exSt.sem).filter(u => exCnt[u]); exDraw(); };
  document.querySelectorAll(".seg [data-g]").forEach(b => b.onclick = async () => { exSt.grade = +b.dataset.g; await exLoadCnt(); exSt.units = exDef(exSt.sem).filter(u => exCnt[u]); exDraw(); });
  document.querySelectorAll(".seg [data-s]").forEach(b => b.onclick = () => { exSt.sem = +b.dataset.s; exSt.units = exDef(exSt.sem).filter(u => exCnt[u]); exDraw(); });
  document.querySelectorAll(".units input").forEach(c => c.onchange = () => {
    const u = +c.dataset.u;
    exSt.units = c.checked ? [...new Set([...exSt.units, u])].sort((a, b) => a - b) : exSt.units.filter(x => x != u);
  });
  if ($("#exgo")) $("#exgo").onclick = exStart;
  $("#expt").onclick = exPrintHome;

async function exStart() {
  const us = exSt.units.filter(u => exCnt[u]);
  if (!us.length) return alert("준비된 단원을 한 개 이상 선택하세요.");
  const rows = need(await sb.rpc("exam_start", { p_textbook: exSt.tb, p_grade: exSt.grade, p_units: us }));
  if (!rows || !rows.length) return alert("출제할 문제가 없어요.");
  const t = TB.find(x => x.id == exSt.tb);
  exRun(rows, `${t.label} ${exSt.grade}학년 ${EXSEM[exSt.sem]}`);
}
function exRun(rows, title) {
  setLock(true); const ans = {};
  html(hdr() + `<div class="exbar"><b>${esc(title)}</b><span><b id="exn">0</b> / ${rows.length}</span></div>` +
    rows.map(q => `<div class="card exq"><div class="exh"><b>${q.no}.</b> <span class="tag">${esc(q.qtype)}</span></div>
      <p class="q">${esc(q.prompt)}</p>${q.passage ? `<div class="pass">${esc(q.passage)}</div>` : ""}
      ${q.choices.map((c, k) => `<button class="ch" data-q="${q.question_id}" data-k="${k + 1}">${exNum[k]} ${esc(c)}</button>`).join("")}</div>`).join("") +
    `<button class="btn" id="exsub">제출하기</button>`);
  document.querySelectorAll(".ch").forEach(b => b.onclick = () => {
    ans[b.dataset.q] = +b.dataset.k;
    b.parentNode.querySelectorAll(".ch").forEach(x => x.classList.toggle("on", x === b));
    $("#exn").textContent = Object.keys(ans).length;
  });
  $("#exsub").onclick = async () => {
    const left = rows.length - Object.keys(ans).length;
    if (left && !confirm(`아직 ${left}문제를 풀지 않았어요. 그래도 제출할까요?`)) return;
    $("#exsub").disabled = true;
    const d = need(await sb.rpc("exam_submit", { p_session: rows[0].session_id, p_answers: ans }));
    if (!d) { $("#exsub").disabled = false; return; }
    setLock(false); exResult(d, title);
  };
}
const exReview = x => `<div class="rv"><div class="exh">${x.no != null ? `<b>${x.no}.</b> ` : ""}<span class="tag">${esc(x.qtype)}</span></div>
  <p class="q">${esc(x.prompt)}</p>${x.passage ? `<div class="pass">${esc(x.passage)}</div>` : ""}
  ${x.choices.map((c, k) => `<div class="rc ${k + 1 == x.correct_answer ? "good" : ""} ${k + 1 == x.selected && k + 1 != x.correct_answer ? "bad" : ""}">${exNum[k]} ${esc(c)}${k + 1 == x.correct_answer ? " ✔ 정답" : ""}${k + 1 == x.selected && k + 1 != x.correct_answer ? " (내 답)" : ""}</div>`).join("")}
  ${x.explanation ? `<div class="exp">💡 ${esc(x.explanation)}</div>` : ""}</div>`;
function exResult(d, title) {
  const ok = d.filter(x => x.is_correct).length, byT = {}, wrong = d.filter(x => !x.is_correct);
  d.forEach(x => { const a = byT[x.qtype] = byT[x.qtype] || [0, 0]; a[1]++; if (x.is_correct) a[0]++; });
  html(hdr() + `<div class="card"><h2>${esc(title)} 결과</h2>
    <p class="big">${Math.round(100 * ok / d.length)}점 <small>(${ok} / ${d.length})</small></p>
    <div>${Object.entries(byT).map(([t, v]) => `<span class="tag">${esc(t)} ${v[0]}/${v[1]}</span>`).join(" ")}</div>
    ${wrong.length ? `<p class="muted">틀린 문제는 오답노트에 저장됐어요.</p>` : `<p class="ok">모두 맞았어요! 🎉</p>`}

/* ---------- 문제은행 업로드 · 시험지 출력 (관리자) ---------- */
let bk = { tb: 0, grade: 1, rows: null }, pr = { tb: 0, grade: 1, unit: 0, round: 0, key: 1, cols: 2, map: {} };
const optTb = id => TB.map(t => `<option value="${t.id}" ${t.id == id ? "selected" : ""}>${esc(t.label)}</option>`).join("");
const optG = g => [1, 2, 3].map(x => `<option value="${x}" ${x == g ? "selected" : ""}>${x}학년</option>`).join("");

async function adminBank() {
  if (!TB.length) { const r = await sb.from("textbooks").select("*").order("sort_no"); TB = r.data || []; }
  if (!TB.length) return;
  if (!bk.tb) bk.tb = pr.tb = TB[0].id;
  $("#app").insertAdjacentHTML("beforeend", `<div class="card"><h2>📤 내신 문제은행 업로드</h2>

    <input type="file" id="bkf" accept=".xlsx,.xls">
    <div id="bkinfo" class="muted">엑셀의 '전체' 시트(단원번호·발문·지문·보기1~5·정답·해설·유형·회차)를 읽어요. 같은 단원·회차·번호의 문제는 덮어써요.</div>
    <button class="btn" id="bkgo" disabled>등록하기</button></div>

  $("#bktb").onchange = e => bk.tb = +e.target.value;

async function bkRead(f) {
  const info = $("#bkinfo"); bk.rows = null; $("#bkgo").disabled = true;
  if (!f) return;
  if (typeof XLSX === "undefined") { info.textContent = "엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결 확인 후 새로고침하세요."; return; }
  const g = f.name.match(/([1-3])\s*학년/); if (g) { bk.grade = +g[1]; $("#bkg").value = g[1]; }
  const nm = f.name.replace(/[\s_]/g, ""), t = TB.find(x => nm.includes(x.label.replace(/\s/g, "")));
  if (t) { bk.tb = t.id; $("#bktb").value = t.id; }
  try {
    const wb = XLSX.read(await f.arrayBuffer()), rows = [], errs = [], seq = {};
    (wb.SheetNames.includes("전체") ? ["전체"] : wb.SheetNames).forEach(sn => {
      const sr = (sn.match(/\d+/) || [""])[0];
      XLSX.utils.sheet_to_json(wb.Sheets[sn], { defval: "" }).forEach((r, i) => {
        const s = k => String(r[k] ?? "").trim(), at = `${sn} ${i + 2}행`;
        const unit = Number(s("단원번호")), round = Number(s("회차") || sr), ans = Number(s("정답"));
        const ch = [1, 2, 3, 4, 5].map(k => s("보기" + k));
        if (!Number.isInteger(unit) || unit < 1 || unit > 8) return errs.push(`${at}: 단원번호는 1~8이어야 해요`);
        if (!Number.isInteger(round) || round < 1) return errs.push(`${at}: 회차가 없어요`);
        if (!s("발문")) return errs.push(`${at}: 발문이 비어 있어요`);
        if (ch.some(c => !c)) return errs.push(`${at}: 보기 5개가 모두 필요해요`);
        if (!Number.isInteger(ans) || ans < 1 || ans > 5) return errs.push(`${at}: 정답은 1~5여야 해요`);
        const key = unit + "|" + round; seq[key] = (seq[key] || 0) + 1;
        rows.push({ unit_no: unit, round_no: round, seq: seq[key], qtype: s("유형") || "기타", prompt: s("발문"), passage: s("지문") || null, choices: ch, answer: ans, explanation: s("해설") || null });
      });
    });
    if (errs.length) { info.innerHTML = `<span style="color:var(--no)">확인이 필요해요 (${errs.length}건)</span><br>${errs.slice(0, 5).map(esc).join("<br>")}`; return; }
    if (!rows.length) { info.textContent = "읽을 문제가 없어요."; return; }
    const us = [...new Set(rows.map(r => r.unit_no))].sort((a, b) => a - b), rs = new Set(rows.map(r => r.round_no)).size;
    bk.rows = rows; $("#bkgo").disabled = false;
    info.textContent = `${rows.length}문항 확인 완료 — Lesson ${us.join(", ")} · ${rs}개 회차. 교과서·학년이 맞는지 확인하고 등록하세요.`;
  } catch (e) { info.textContent = "파일을 읽지 못했어요: " + e.message; }
}
async function bkSave() {
  const info = $("#bkinfo"), go = $("#bkgo"), t = TB.find(x => x.id == bk.tb);
  if (!bk.rows || !confirm(`${t.label} ${bk.grade}학년에 ${bk.rows.length}문항을 등록할까요?\n(같은 단원·회차·번호 문제는 덮어써요)`)) return;
  go.disabled = true;
  const { data: ss } = await sb.auth.refreshSession();
  if (!ss?.session) { info.textContent = "로그인이 만료됐어요. 로그아웃 후 다시 로그인해 주세요."; go.disabled = false; return; }
  const data = bk.rows.map(r => ({ ...r, textbook_id: bk.tb, grade: bk.grade }));
  for (let i = 0; i < data.length; i += 50) {
    info.textContent = `등록 중… ${Math.min(i + 50, data.length)} / ${data.length}`;

  }
  info.textContent = `✅ ${data.length}문항 등록 완료`; bk.rows = null; $("#bkf").value = ""; pr.tb = bk.tb; pr.grade = bk.grade; prLoad();
}
async function prLoad() {
  const box = $("#prbox"); box.textContent = "불러오는 중…"; const map = {};
  for (let from = 0; ; from += 1000) {
    const r = await sb.from("exam_questions").select("unit_no,round_no").eq("textbook_id", pr.tb).eq("grade", pr.grade).order("id").range(from, from + 999);
    if (r.error) { box.textContent = "불러오기 오류: " + r.error.message; return; }
    r.data.forEach(x => { const u = map[x.unit_no] = map[x.unit_no] || {}; u[x.round_no] = 1; });
    if (r.data.length < 1000) break;
  }
  pr.map = map; prDraw();
}
function prDraw() {
  const box = $("#prbox"), us = Object.keys(pr.map).map(Number).sort((a, b) => a - b);
  const head = `<div class="row2"><select id="prtb">${optTb(pr.tb)}</select><select id="prg">${optG(pr.grade)}</select></div>`;
  const wire = () => { $("#prtb").onchange = e => { pr.tb = +e.target.value; prLoad(); }; $("#prg").onchange = e => { pr.grade = +e.target.value; prLoad(); }; };
  if (!us.length) { box.innerHTML = head + `<p>이 교과서·학년에는 등록된 문제가 없어요.</p>`; return wire(); }
  if (!pr.map[pr.unit]) pr.unit = us[0];
  const rs = Object.keys(pr.map[pr.unit]).map(Number).sort((a, b) => a - b);
  if (!pr.map[pr.unit][pr.round]) pr.round = rs[0];
  box.innerHTML = head + `<div class="row2"><select id="pru">${us.map(u => `<option value="${u}" ${u == pr.unit ? "selected" : ""}>Lesson ${u}</option>`).join("")}</select>
    <select id="prr">${rs.map(r => `<option value="${r}" ${r == pr.round ? "selected" : ""}>${r}회</option>`).join("")}</select></div>
    <div class="row2"><select id="prk"><option value="1" ${pr.key ? "selected" : ""}>문제지 + 정답·해설지</option><option value="0" ${pr.key ? "" : "selected"}>문제지만</option></select>
    <select id="prc"><option value="2" ${pr.cols == 2 ? "selected" : ""}>2단 편집</option><option value="1" ${pr.cols == 1 ? "selected" : ""}>1단 편집</option></select></div>
    <button class="btn" id="prgo">미리보기 · 인쇄</button>`;
  wire();
  $("#pru").onchange = e => { pr.unit = +e.target.value; prDraw(); };
  $("#prr").onchange = e => pr.round = +e.target.value;
  $("#prk").onchange = e => pr.key = +e.target.value;

async function prPrint() {
  const r = await sb.from("exam_questions").select("*").eq("textbook_id", pr.tb).eq("grade", pr.grade).eq("unit_no", pr.unit).eq("round_no", pr.round).order("seq");
  const qs = need(r); if (!qs || !qs.length) return alert("문제가 없어요.");

    <div class="paper"><div class="ph"><b>${esc(title)}</b><span>이름 __________ &nbsp; 점수 ______ / ${qs.length}</span></div>
    <div class="pq c${pr.cols}">${qs.map((q, i) => `<div class="pi"><p><b>${i + 1}.</b> ${ul(q.prompt)}</p>${q.passage ? `<div class="pp">${ul(q.passage)}</div>` : ""}${q.choices.map((c, k) => `<div class="pc">${exNum[k]} ${ul(c)}</div>`).join("")}</div>`).join("")}</div>
    ${pr.key ? `<div class="pk"><div class="ph"><b>${esc(title)} 정답 및 해설</b></div>
      <div class="pans">${qs.map((q, i) => `<span>${i + 1}. <b>${exNum[q.answer - 1]}</b></span>`).join("")}</div>

/* ---------- 시험지 출력 (학생·관리자 내신 화면) ---------- */
const EXTQ = [["어휘", 5], ["빈칸", 5], ["문법", 5], ["어순", 4], ["의사소통", 3], ["독해", 3]];
let exPool = {}, exPr = { us: [], pools: {}, N: 0 };
const exPK = () => `prt:${me.id}:${exSt.tb}:${exSt.grade}:${exPr.us.join("-")}`;
const exPrinted = () => { try { return JSON.parse(localStorage.getItem(exPK()) || "[]"); } catch (e) { return []; } };
const exMark = n => { try { const a = exPrinted(); if (!a.includes(n)) { a.push(n); localStorage.setItem(exPK(), JSON.stringify(a)); } } catch (e) {} };

/* i번째(0부터) 시험지: 한 단원이면 그 단원의 i+1회 그대로, 여러 단원이면 단원별 회차를 반씩 섞어 25문항 */
function exBuild(pools, units, i) {
  if (units.length === 1) {
    const rows = pools[units[0]], R = [...new Set(rows.map(r => r.round_no))].sort((a, b) => a - b);
    return rows.filter(r => r.round_no === R[i % R.length]).sort((a, b) => a.seq - b.seq);
  }
  const k = units.length, out = [];
  units.forEach((u, ui) => {
    const rows = pools[u], R = [...new Set(rows.map(r => r.round_no))].sort((a, b) => a - b);
    const rd = R[(i + ui) % R.length], pass = Math.floor(i / R.length) % 2;
    const inRound = rows.filter(r => r.round_no === rd);
    EXTQ.forEach(([t, q], ord) => {
      const L = inRound.filter(r => r.qtype === t).sort((a, b) => a.seq - b.seq);
      const n = Math.floor(q / k) + (((ui + ord + 1 + pass) % k) < (q % k) ? 1 : 0);
      (pass ? L.slice(Math.max(0, L.length - n)) : L.slice(0, n)).forEach(r => out.push({ ord, ui, r }));
    });
  });
  return out.sort((a, b) => a.ord - b.ord || a.ui - b.ui || a.r.seq - b.r.seq).map(x => x.r);
}
const exUl = s => esc(s).replace(/\[([^\]]+)\]/g, "<u>$1</u>");
function paperHtml(title, qs, cols, key) {
  return `<div class="paper"><div class="ph"><b>${esc(title)}</b><span>이름 __________ &nbsp; 점수 ______ / ${qs.length}</span></div>
    <div class="pq c${cols}">${qs.map((q, i) => `<div class="pi"><p><b>${i + 1}.</b> ${exUl(q.prompt)}</p>${q.passage ? `<div class="pp">${exUl(q.passage)}</div>` : ""}${q.choices.map((c, k) => `<div class="pc">${exNum[k]} ${exUl(c)}</div>`).join("")}</div>`).join("")}</div>
    ${key ? `<div class="pk"><div class="ph"><b>${esc(title)} 정답 및 해설</b></div>
      <div class="pans">${qs.map((q, i) => `<span>${i + 1}. <b>${exNum[q.answer - 1] || "-"}</b></span>`).join("")}</div>
      ${qs.map((q, i) => q.explanation ? `<div class="pex"><b>${i + 1}. ${exNum[q.answer - 1] || ""}</b> ${exUl(q.explanation)}</div>` : "").join("")}</div>` : ""}</div>`;
}
async function exPrintHome() {
  const us = exSt.units.filter(u => exCnt[u]).sort((a, b) => a - b);
  if (!us.length) return alert("출력할 단원을 한 개 이상 체크하세요.");
  html(hdr() + `<div class="card"><h2>🖨 시험지 출력</h2><p class="muted">문제를 불러오는 중…</p></div>`);
  const pools = {};
  for (const u of us) {
    const key = `${exSt.tb}|${exSt.grade}|${u}`;
    if (!exPool[key]) { const d = need(await sb.rpc("exam_print_pool", { p_textbook: exSt.tb, p_grade: exSt.grade, p_unit: u })); if (!d) return exDraw(); exPool[key] = d; }
    pools[u] = exPool[key];
  }
  exPr = { us, pools, N: us.length === 1 ? new Set(pools[us[0]].map(r => r.round_no)).size : 20 };
  exPrintDraw();
}
function exPrintDraw() {
  const t = TB.find(x => x.id == exSt.tb), done = exPrinted();
  html(hdr() + `<div class="card"><h2>🖨 시험지 출력</h2>
    <p class="muted">${esc(t.label)} ${exSt.grade}학년 ${EXSEM[exSt.sem]} · ${exPr.us.map(u => "Lesson " + u).join(", ")}<br>회차마다 25문항이에요. 출력한 회차는 회색으로 바뀌어요.</p>
    <div class="rgrid">${Array.from({ length: exPr.N }, (_, i) => `<button class="rbtn ${done.includes(i + 1) ? "done" : ""}" data-i="${i}">${i + 1}회${done.includes(i + 1) ? " ✓" : ""}</button>`).join("")}</div>
    <button class="btn ghost" id="exclr">출력 표시 지우기</button>
    <button class="btn ghost" onclick="exDraw()">← 내신 준비로</button></div>`);
  document.querySelectorAll(".rbtn").forEach(b => b.onclick = () => exPaperView(+b.dataset.i));
  $("#exclr").onclick = () => { try { localStorage.removeItem(exPK()); } catch (e) {} exPrintDraw(); };
}
function exPaperView(i) {
  const qs = exBuild(exPr.pools, exPr.us, i), t = TB.find(x => x.id == exSt.tb), n = i + 1;
  if (!qs.length) return alert("이 회차에 출제할 문제가 없어요.");
  const title = `${t.label} ${exSt.grade}학년 ${EXSEM[exSt.sem]} 예상문제 ${n}회 (Lesson ${exPr.us.join(", ")})`;
  const adm = qs.some(q => q.answer);
  html(`<div class="noprint bar2"><button class="btn ghost" id="exbk">← 회차 선택</button><button class="btn" id="expr">🖨 인쇄 / PDF 저장</button></div>
    ${adm ? `<label class="noprint"><input type="checkbox" id="exkey" checked style="width:auto"> 정답·해설지 포함</label>` : ""}
    ${paperHtml(title, qs, 2, adm)}`);
  $("#exbk").onclick = exPrintDraw;
  $("#expr").onclick = () => { exMark(n); window.print(); };
  if (adm) $("#exkey").onchange = e => { const k = document.querySelector(".pk"); if (k) k.style.display = e.target.checked ? "" : "none"; };
}

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
