<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이보람 김포점 문법</title>
<style>
:root{--ink:#16233b;--bg:#f3f6fb;--card:#fff;--line:#d9e0ec;--acc:#2f6bff;--accT:#fff;--ok:#1f9d6b;--no:#d64550;--hl:#ffe58a;--mut:#667189}
@media (prefers-color-scheme:dark){:root{--ink:#e8edf7;--bg:#10141d;--card:#1a2130;--line:#2e384d;--acc:#6c93ff;--accT:#0c1220;--ok:#4fd1a0;--no:#ff7b84;--hl:#5b4a12;--mut:#9aa6bf}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:12px 14px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.narrow{max-width:380px;margin:12vh auto}
h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:4px 0 12px;line-height:1.4}
.muted{color:var(--mut);font-size:14px}.err{color:var(--no);min-height:1.4em;margin:8px 0 0}
input,select{width:100%;font:inherit;padding:11px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accT);font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.link{background:none;border:0;color:var(--acc);padding:0 4px;text-decoration:underline}
.steps{display:grid;gap:8px;margin:14px 0 4px}
.step{display:flex;justify-content:space-between;text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.step.done{border-color:var(--ok)}.step.done::after{content:"✔ 완료";color:var(--ok);font-weight:700}
.video{position:relative;padding-top:56.25%;margin:10px 0;border-radius:10px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.q{font-size:19px;line-height:1.6;margin:6px 0 14px}
.slot{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:17px}
.chip.on{background:var(--hl)}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr.off{opacity:.5}.act button{margin-right:4px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.lay{display:grid;grid-template-columns:310px 1fr;gap:14px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;max-height:calc(100vh - 80px);overflow:auto;position:sticky;top:8px}
.un{width:100%;display:flex;justify-content:space-between;gap:8px;padding:11px 12px;margin-top:6px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font-weight:700;text-align:left}
.sub{display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:14px}
.sub.cur{background:var(--hl)}.sub b{color:var(--acc);white-space:nowrap}
.vwrap{display:flex;flex-direction:column;background:#000;border-radius:10px;overflow:hidden}
.vwrap iframe{width:100%;aspect-ratio:16/9;border:0}
.vbar{display:flex;gap:8px;padding:8px;background:var(--card)}.vbar .btn{margin:0}
.vwrap:fullscreen{border-radius:0}.vwrap:fullscreen iframe{flex:1;aspect-ratio:auto;min-height:0}
.note{font-size:17px;line-height:2.5}.bl{display:inline-flex;align-items:center;gap:4px;margin:0 3px}
.bl input{width:auto;margin:0;padding:3px 8px;text-align:center;border-bottom:2px solid var(--acc)}.bl input.good{border-color:var(--ok);color:var(--ok)}
.hint{font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.hint:disabled{opacity:.5}
.ans{color:var(--no);font-size:14px}
@media(max-width:820px){.lay{grid-template-columns:1fr}.side{position:static;max-height:42vh}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SITE = "아이보람 김포점 문법";
const SB_URL = "https://anzdgisybvlxxusspfom.supabase.co";
const SB_KEY = "sb_publishable_ZozBAhHUaGdxcQu9YGttUA_1-2IdGgE";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const html = h => { $("#app").innerHTML = h; window.scrollTo(0, 0); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = d => d ? new Date(d).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "-";
const need = r => { if (r.error) { alert("문제가 생겼어요: " + r.error.message); return null; } return r.data; };
let me = null, lessons = [], R = [];

const hdr = () => `<div class="bar"><b>${SITE}</b><span>${esc(me.name)} <button class="link" onclick="logout()">나가기</button></span></div>`;
async function logout() { await sb.auth.signOut(); me = null; loginView(); }

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  session ? loadMe() : loginView();
}

async function loadMe() {
  const { data: { user } } = await sb.auth.getUser();
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if (error || !data || !data.active) { await sb.auth.signOut(); return loginView("사용할 수 없는 계정이에요. 선생님께 문의하세요."); }
  me = data;
  const l = await sb.from("lessons").select("lesson_no,unit,title,embed_url").order("lesson_no");
  lessons = l.data || [];
  me.role === "admin" ? adminView() : lessonView();
}

function loginView(msg = "") {
  html(`<div class="card narrow"><h1>${SITE}</h1><p class="muted">선생님이 알려준 아이디와 비밀번호를 입력하세요.</p>
    <input id="u" placeholder="아이디" autocapitalize="none" autocomplete="username">
    <input id="p" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" id="go">로그인</button><p class="err">${esc(msg)}</p></div>`);
  const go = async () => {
    const u = $("#u").value.trim().toLowerCase(), p = $("#p").value;
    if (!u || !p) return;
    $("#go").disabled = true;
    const email = u.includes("@") ? u : u + "@student.example.com";
    const { error } = await sb.auth.signInWithPassword({ email, password: p });
    if (error) return loginView("아이디 또는 비밀번호가 맞지 않아요.");
    loadMe();
  };
  $("#go").onclick = go;
  $("#p").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ---------- 학생 화면 ---------- */
const UN=["명사와 관사","인칭대명사","be동사와 일반동사","형용사","부사","be동사 과거","일반동사 과거","미래시제","진행시제","조동사","비교급과 최상급","전치사","접속사","의문사","명령문과 제안문","문장의 형식","현재완료와 조동사 표현","수동태","가정법","to부정사","동명사","분사","부사절과 분사구문","관계대명사","관계부사"];
let prog = {}, openU = 0, cur = 0, tick = 0;
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, "");
const CH = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho = s => [...s.replace(/[A-Za-z]+/g, w => w[0] + "○".repeat(w.length - 1))].map(c => { const n = c.charCodeAt(0) - 44032; return n >= 0 && n < 11172 ? CH[n / 588 | 0] : c; }).join("");
const mainHtml = h => { clearInterval(tick); $("#main").innerHTML = h; };
async function getQs(no, step) { return need(await sb.rpc("get_questions", { p_lesson: no, p_step: step })) || []; }

function sideHtml() {
  const by = {}; lessons.forEach(l => (by[l.unit] = by[l.unit] || []).push(l));
  return Object.keys(by).map(u => {
    const a = by[u], d = a.filter(l => prog[l.lesson_no]).length;
    return `<button class="un" onclick="openU=${openU == u ? 0 : u};drawSide()"><span>${u}. ${UN[u - 1] || "단원"}</span><small>${Math.round(100 * d / a.length)}%</small></button>` +
      (openU == u ? a.map(l => `<button class="sub ${l.lesson_no == cur ? "cur" : ""}" onclick="go(${l.lesson_no})"><span>${l.lesson_no}. ${esc(l.title)}</span>${prog[l.lesson_no] ? "<b>학습완료</b>" : ""}</button>`).join("") : "");
  }).join("");
}
const drawSide = () => { $(".side").innerHTML = sideHtml(); };

async function lessonView() {
  const r = await sb.from("progress").select("lesson_no,completed_at").eq("student_id", me.id);
  prog = {}; (r.data || []).forEach(p => { if (p.completed_at) prog[p.lesson_no] = true; });
  const nx = lessons.find(l => !prog[l.lesson_no]) || lessons[0];
  if (!nx) return html(hdr() + `<div class="card">강의가 아직 없어요.</div>`);
  html(hdr() + `<div class="lay"><div class="side"></div><div id="main"></div></div>`);
  go(nx.lesson_no);
}

const vid = L => `<div class="card"><div class="muted">${L.lesson_no}강 · ${esc(UN[L.unit - 1] || "")}</div><h2>${esc(L.title)}</h2>
  <div class="vwrap" id="vw"><iframe src="${esc(L.embed_url)}" allow="autoplay; fullscreen" allowfullscreen title="강의 영상"></iframe>
  <div class="vbar"><button class="btn ghost" id="fs">전체화면</button><button class="btn" id="seen">다 봤어요</button></div></div></div>`;

function wire(no) {
  $("#fs").onclick = () => { document.fullscreenElement ? document.exitFullscreen() : $("#vw").requestFullscreen(); };
  $("#seen").onclick = async () => { need(await sb.rpc("save_progress", { p_lesson: no, p_step: "video" })); noteStep(no); };
}

function go(no) {
  cur = no; const L = lessons.find(x => x.lesson_no == no); openU = L.unit; drawSide();
  mainHtml((prog[no] ? `<p class="ok">학습완료한 강의예요. 다시 학습할 수 있어요.</p>` : "") + vid(L));
  wire(no); window.scrollTo(0, 0);
}

async function noteStep(no) {
  const { data } = await sb.from("notes").select("body").eq("lesson_no", no).maybeSingle();
  if (!data) return typeStep(no);
  const it = [];
  const body = data.body.split(/\{\{(.*?)\}\}/).map((t, k) => {
    if (k % 2 == 0) return esc(t).replace(/\n/g, "<br>");
    const i = it.push({ a: t.trim(), t0: 0, th: 0, ok: 0 }) - 1;
    return `<span class="bl"><input data-i="${i}" size="${Math.max(4, t.trim().length + 1)}" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="hint" data-h="${i}" disabled>힌트(10)</button><span class="ans" id="x${i}"></span></span>`;
  }).join("");
  mainHtml(`<div class="card"><div class="muted">요점정리노트 · 괄호를 채워 보세요</div><div class="note">${body}</div><button class="btn" id="nxt" disabled>다음: 문장 입력하기</button></div>`);
  const hs = document.querySelectorAll(".hint");
  document.querySelectorAll(".bl input").forEach(el => {
    const i = el.dataset.i, x = it[i];
    el.onfocus = () => { if (!x.t0) x.t0 = Date.now(); };
    el.oninput = () => {
      if (norm(el.value) !== norm(x.a)) return;
      x.ok = 1; el.classList.add("good"); el.disabled = true; $("#x" + i).textContent = ""; hs[i].hidden = true;
      if (it.every(y => y.ok)) $("#nxt").disabled = false;
    };
  });
  hs.forEach(b => b.onclick = () => {
    const x = it[b.dataset.h], o = $("#x" + b.dataset.h);
    if (!x.th) { x.th = Date.now(); o.textContent = "초성: " + cho(x.a); }
    else { o.textContent = "정답: " + x.a; b.hidden = true; }
  });
  tick = setInterval(() => {
    const now = Date.now();
    it.forEach((x, i) => {
      const b = hs[i]; if (x.ok || b.hidden) return;
      if (!x.th) { const s = x.t0 ? 10 - Math.floor((now - x.t0) / 1000) : 10; b.disabled = s > 0; b.textContent = s > 0 ? `힌트(${s})` : "힌트보기"; }
      else { const s = 10 - Math.floor((now - x.th) / 1000); b.disabled = s > 0; b.textContent = s > 0 ? `정답보기(${s})` : "정답보기"; }
    });
  }, 500);
  $("#nxt").onclick = () => typeStep(no);
}

async function typeStep(no) {
  const qs = await getQs(no, "order");
  if (!qs.length) return quizStep(no);
  let i = 0;
  const show = () => {
    if (i >= qs.length) {
      mainHtml(`<div class="card"><h2>${qs.length >= 60 ? "60문장을 모두 입력했어요! 정말 대단해요 👏" : "문장 입력을 모두 마쳤어요! 👏"}</h2><button class="btn" id="go">퀴즈 풀기</button></div>`);
      $("#go").onclick = () => quizStep(no); return;
    }
    if (i > 0 && i % 20 == 0 && !qs[i].seen) {
      qs[i].seen = 1;
      mainHtml(`<div class="card"><h2>${i}문장 완료! 👍</h2><p>더 입력할수록 어순 감각이 좋아져요.</p><button class="btn" id="more">다음 20문장 계속하기</button><button class="btn ghost" id="quiz">여기까지만 하고 퀴즈풀기로 넘어갈게요</button></div>`);
      $("#more").onclick = show; $("#quiz").onclick = () => quizStep(no); return;
    }
    const q = qs[i], pg = Math.floor(i / 20) + 1, pgs = Math.ceil(qs.length / 20);
    mainHtml(`<div class="card"><div class="muted">어순 맞춰 입력하기 · ${i + 1} / ${qs.length} (${pg}/${pgs}쪽)</div>
      ${q.prompt ? `<p class="q">${esc(q.prompt)}</p>` : ""}
      <div class="pool">${(q.words || []).map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>
      <input id="ans" placeholder="알맞은 순서로 문장을 입력하세요" autocomplete="off" autocapitalize="none" spellcheck="false">
      <button class="btn" id="ok">확인</button><div id="fb"></div></div>`);
    const inp = $("#ans"); inp.focus(); let busy = false;
    const nxt = () => { i++; show(); };
    const check = async () => {
      if (busy || !inp.value.trim()) return; busy = true;
      const d = need(await sb.rpc("submit_answer", { p_question: q.id, p_answer: inp.value }));
      if (!d) { busy = false; return; }
      const r = d[0]; inp.disabled = true; $("#ok").hidden = true;
      if (r.is_correct) { $("#fb").innerHTML = `<p class="ok">정답! 👍</p>`; setTimeout(nxt, 700); }
      else { $("#fb").innerHTML = `<p class="no">정답: ${esc(r.correct_answer)}</p><button class="btn" id="nx">다음 문장</button>`; $("#nx").onclick = nxt; $("#nx").focus(); }
    };
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
    $("#ok").onclick = check;
  };
  show();
}

async function quizStep(no) {
  const qs = shuffle(await getQs(no, "quiz")).slice(0, 10); let i = 0, right = 0;
  const show = () => {
    if (i >= qs.length) return finish(no, right, qs.length);
    const q = qs[i];
    mainHtml(`<div class="card"><div class="muted">퀴즈 · ${i + 1} / ${qs.length}</div><p class="q">${esc(q.prompt)}</p>
      ${shuffle([...(q.choices || [])]).map((c, k) => `<button class="choice" data-c="${esc(c)}">${"①②③④⑤"[k]} ${esc(c)}</button>`).join("")}<div id="fb"></div></div>`);
    const all = document.querySelectorAll(".choice");
    all.forEach(b => b.onclick = async () => {
      all.forEach(x => x.disabled = true);
      const d = need(await sb.rpc("submit_answer", { p_question: q.id, p_answer: b.dataset.c }));
      if (!d) { all.forEach(x => x.disabled = false); return; }
      const r = d[0]; if (r.is_correct) right++;
      b.style.borderColor = r.is_correct ? "var(--ok)" : "var(--no)";
      $("#fb").innerHTML = `<p class="${r.is_correct ? "ok" : "no"}">${r.is_correct ? "정답이에요! 👍" : "아쉬워요. 정답: " + esc(r.correct_answer)}</p><button class="btn" id="nx">${i + 1 < qs.length ? "다음 문제" : "결과 보기"}</button>`;
      $("#nx").onclick = () => { i++; show(); };
    });
  };
  show();
}

async function finish(no, right, n) {
  need(await sb.rpc("save_progress", { p_lesson: no, p_step: "note" }));
  need(await sb.rpc("save_progress", { p_lesson: no, p_step: "practice" }));
  prog[no] = true;
  const nx = lessons.find(l => l.lesson_no > no);
  const card = `<div class="card"><h2>🎉 학습완료!</h2>${n ? `<p>퀴즈 ${n}문제 중 <b>${right}</b>개 맞았어요.</p>` : ""}${nx ? `<p class="muted">다음 강의 영상이 준비됐어요.</p>` : `<p class="ok">마지막 강의까지 모두 마쳤어요!</p>`}</div>`;
  if (nx) { cur = nx.lesson_no; openU = nx.unit; drawSide(); mainHtml(card + vid(nx)); wire(nx.lesson_no); }
  else { drawSide(); mainHtml(card); }
  window.scrollTo(0, 0);
}

/* ---------- 관리자 화면 ---------- */
async function adminView() {
  R = need(await sb.rpc("admin_report")) || [];
  const rows = R.map((s, i) => `<tr class="${s.active ? "" : "off"}"><td>${esc(s.name)}</td><td>${esc(s.login)}</td><td>${s.current_lesson}</td><td>${s.lessons_done}</td><td>${s.attempts_7d}</td>
    <td>${s.accuracy_7d == null ? "-" : s.accuracy_7d + "%"}</td><td>${fmt(s.last_active)}</td>
    <td class="act"><button onclick="detail(${i})">상세</button><button onclick="resetPw(${i})">비밀번호</button><button onclick="toggle(${i})">${s.active ? "중지" : "재개"}</button></td></tr>`).join("");
  html(hdr() + `<div class="card"><h2>학생 리포트</h2><div class="scroll"><table>
    <thead><tr><th>이름</th><th>아이디</th><th>현재 강</th><th>완료</th><th>7일 문제</th><th>7일 정답률</th><th>마지막 학습</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="8">아직 학생이 없어요. 아래에서 추가하세요.</td></tr>`}</tbody></table></div><div id="det"></div></div>
    <div class="card"><h2>학생 추가</h2><div class="row">
      <input id="nl" placeholder="아이디 (영문 소문자·숫자)" autocapitalize="none">
      <input id="np" placeholder="비밀번호 (6자 이상)">
      <input id="nn" placeholder="이름"></div>
      <button class="btn" id="add">학생 만들기</button></div>`);
  $("#add").onclick = async () => {
    const l = $("#nl").value, p = $("#np").value, n = $("#nn").value.trim();
    if (!l || !p || !n) return alert("아이디, 비밀번호, 이름을 모두 입력하세요.");
    const d = need(await sb.rpc("admin_create_student", { p_login: l, p_password: p, p_name: n }));
    if (d) { alert(d + "\n아이디: " + l.toLowerCase() + "\n비밀번호: " + p); adminView(); }
  };
}

async function detail(i) {
  const s = R[i];
  const d = need(await sb.rpc("admin_lesson_stats", { p_student: s.student_id })) || [];
  $("#det").innerHTML = `<h2 style="margin-top:20px">${esc(s.name)} · 강의별 결과</h2><div class="scroll"><table>
    <thead><tr><th>강</th><th>제목</th><th>푼 문제</th><th>정답</th><th>정답률</th><th>완료</th></tr></thead><tbody>
    ${d.map(x => `<tr><td>${x.lesson_no}</td><td style="white-space:normal">${esc(x.title)}</td><td>${x.attempts}</td><td>${x.correct}</td>
      <td>${x.attempts ? Math.round(100 * x.correct / x.attempts) + "%" : "-"}</td><td>${fmt(x.completed_at)}</td></tr>`).join("") || `<tr><td colspan="6">아직 학습 기록이 없어요.</td></tr>`}
    </tbody></table></div>`;
}

async function resetPw(i) {
  const s = R[i], p = prompt(s.name + " 학생의 새 비밀번호 (6자 이상)");
  if (!p) return;
  const d = need(await sb.rpc("admin_reset_password", { p_student: s.student_id, p_password: p }));
  if (d) alert(d + "\n새 비밀번호: " + p);
}

async function toggle(i) {
  const s = R[i];
  if (!confirm(s.name + " 학생을 " + (s.active ? "사용 중지" : "다시 사용") + "할까요?")) return;
  need(await sb.rpc("admin_set_active", { p_student: s.student_id, p_active: !s.active }));
  adminView();
}

init();
</script>
</body>
</html>
