<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이보람 김포점 문법</title>
<style>
:root{--okbg:#c9f7d4;--ink:#16233b;--bg:#f3f6fb;--card:#fff;--line:#d9e0ec;--acc:#2f6bff;--accT:#fff;--ok:#1f9d6b;--no:#d64550;--hl:#ffe58a;--mut:#667189}
@media (prefers-color-scheme:dark){:root{--okbg:#1f5a3a;--ink:#e8edf7;--bg:#10141d;--card:#1a2130;--line:#2e384d;--acc:#6c93ff;--accT:#0c1220;--ok:#4fd1a0;--no:#ff7b84;--hl:#5b4a12;--mut:#9aa6bf}}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:12px 14px 60px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.narrow{max-width:380px;margin:12vh auto}
h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:4px 0 12px;line-height:1.4}
.muted{color:var(--mut);font-size:14px}.err{color:var(--no);min-height:1.4em;margin:8px 0 0}
input,select{width:100%;font:inherit;padding:11px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accT);font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.link{background:none;border:0;color:var(--acc);padding:0 4px;text-decoration:underline}
.steps{display:grid;gap:8px;margin:14px 0 4px}
.step{display:flex;justify-content:space-between;text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.step.done{border-color:var(--ok)}.step.done::after{content:"✔ 완료";color:var(--ok);font-weight:700}
.video{position:relative;padding-top:56.25%;margin:10px 0;border-radius:10px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.q{font-size:19px;line-height:1.6;margin:6px 0 14px}
.slot{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:10px;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:17px}
.chip.on{background:var(--hl)}
.sub.rvb{font-weight:700;color:var(--acc)}
.nbt{display:flex;gap:8px;margin:8px 0}.nbt .btn{flex:1;margin:0;padding:10px 6px;font-size:14px}
.nbq .tag{font-size:12px;color:var(--mut)}.nbq .done{color:var(--ok);font-weight:700}
.lh{margin:14px 2px 4px;font-weight:700}
.rvw{border-top:1px solid var(--line);padding-top:8px;margin-top:10px;font-size:15px}
.chip{transition:opacity .15s,background .15s}.chip.used{background:var(--line);color:var(--mut);opacity:.45;text-decoration:line-through}
.choice{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr.off{opacity:.5}.act button{margin-right:4px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.lay{display:grid;grid-template-columns:310px 1fr;gap:14px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;max-height:calc(100vh - 80px);overflow:auto;position:sticky;top:8px}
.un{width:100%;display:flex;justify-content:space-between;gap:8px;padding:11px 12px;margin-top:6px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font-weight:700;text-align:left}
.sub{display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:14px}
.sub.cur{background:var(--hl)}.sub b{color:var(--acc);white-space:nowrap}
.vwrap{display:flex;flex-direction:column;background:#000;border-radius:10px;overflow:hidden}
.vwrap iframe{width:100%;aspect-ratio:16/9;border:0}
.vbar{display:flex;gap:8px;padding:8px;background:var(--card)}.vbar .btn{margin:0}
.vwrap:fullscreen{border-radius:0}.vwrap:fullscreen iframe{flex:1;aspect-ratio:auto;min-height:0}
.note{font-size:17px;line-height:2.5}.bl{display:inline-flex;align-items:center;gap:4px;margin:0 3px}
.bl input{width:auto;margin:0;padding:3px 8px;text-align:center;border-bottom:2px solid var(--acc)}.bl input.good{border-color:var(--ok);color:var(--ok)}
.hint{font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}.hint:disabled{opacity:.5}
.ans{color:var(--no);font-size:14px}
@media(max-width:820px){.lay{grid-template-columns:1fr}.side{position:static;max-height:42vh}}
.tw{display:grid;grid-template-columns:1fr 370px;gap:12px;align-items:start}
.rkbox{position:sticky;top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.rk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
.rkr{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:6px}.rkr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rkr.me{background:var(--hl)}
.srow{position:relative;padding:12px 46px 12px 12px;border:1px solid var(--line);border-radius:10px;margin:10px 0;transition:background .3s,border-color .3s}
.srow .ko{font-size:15px;margin-bottom:6px}.srow .pool{margin-bottom:6px}.srow .chip{padding:3px 10px;font-size:15px}
.mir{min-height:30px;font-size:18px;font-weight:700;padding:2px 4px;border-bottom:2px solid var(--line);margin-bottom:6px;word-break:break-all}
.sin{margin:0;font-size:17px}
.srow .tick{display:none;position:absolute;right:12px;top:12px;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:#2ecc71;color:#fff;font-size:18px}
.srow.ok{background:var(--okbg);border-color:#2ecc71}.srow.ok .tick{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--card);border-radius:14px;padding:16px;max-height:80vh;overflow:auto;width:min(92vw,420px)}
.exp{background:var(--bg);border-left:4px solid var(--acc);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:15px}
.rv{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
@media(max-width:700px){.tw{grid-template-columns:1fr}.rkbox{order:-1;position:static}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SITE = "아이보람 김포점 문법";
const SB_URL = "https://anzdgisybvlxxusspfom.supabase.co";
const SB_KEY = "sb_publishable_ZozBAhHUaGdxcQu9YGttUA_1-2IdGgE";
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const html = h => { $("#app").innerHTML = h; window.scrollTo(0, 0); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = d => d ? new Date(d).toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "-";
const need = r => { if (r.error) { alert("문제가 생겼어요: " + r.error.message); return null; } return r.data; };
let me = null, lessons = [], R = [];
/* 학습 화면 잠금: 새로고침/탭 닫기/뒤로가기 경고 (강의명 클릭·나가기 버튼은 화면 전환이라 영향 없음) */
let lock = false;
function setLock(on) {
  lock = on;
  if (on && !history.state?.lk) { history.replaceState({ lk: 1 }, ""); history.pushState({ lk: 2 }, ""); }
}
window.addEventListener("beforeunload", e => { if (lock) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("popstate", () => { if (lock) history.pushState({ lk: 2 }, ""); });
window.addEventListener("keydown", e => {
  if (lock && (e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r"))) {
    if (!confirm("새로고침하면 입력한 내용이 사라져요. 계속할까요?")) e.preventDefault();
  }
});

const hdr = () => `<div class="bar"><b>${SITE}</b><span>${esc(me.name)} ${me.role === "admin" ? "" : `<button class="link" onclick="notebook()">📒 My Grammar</button> `}<button class="link" onclick="logout()">나가기</button></span></div>`;
async function logout() { setLock(false); await sb.auth.signOut(); me = null; loginView(); }

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  session ? loadMe() : loginView();
}

async function loadMe() {
  const { data: { user } } = await sb.auth.getUser();
  const { data, error } = await sb.from("profiles").select("*").eq("id", user.id).single();
  if (error || !data || !data.active) { await sb.auth.signOut(); return loginView("사용할 수 없는 계정이에요. 선생님께 문의하세요."); }
  me = data;
  const l = await sb.from("lessons").select("lesson_no,unit,title,embed_url").order("lesson_no");
  lessons = l.data || [];
  me.role === "admin" ? adminView() : lessonView();
}

function loginView(msg = "") {
  setLock(false);
  html(`<div class="card narrow"><h1>${SITE}</h1><p class="muted">선생님이 알려준 아이디와 비밀번호를 입력하세요.</p>
    <input id="u" placeholder="아이디" autocapitalize="none" autocomplete="username">
    <input id="p" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" id="go">로그인</button><p class="err">${esc(msg)}</p></div>`);
  const go = async () => {
    const u = $("#u").value.trim().toLowerCase(), p = $("#p").value;
    if (!u || !p) return;
    $("#go").disabled = true;
    const email = u.includes("@") ? u : u + "@student.example.com";
    const { error } = await sb.auth.signInWithPassword({ email, password: p });
    if (error) return loginView("아이디 또는 비밀번호가 맞지 않아요.");
    loadMe();
  };
  $("#go").onclick = go;
  $("#p").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ---------- 학생 화면 ---------- */
const UN=["명사와 관사","인칭대명사","be동사와 일반동사","형용사","부사","be동사 과거","일반동사 과거","미래시제","진행시제","조동사","비교급과 최상급","전치사","접속사","의문사","명령문과 제안문","문장의 형식","현재완료와 조동사 표현","수동태","가정법","to부정사","동명사","분사","부사절과 분사구문","관계대명사","관계부사"];
let prog = {}, openU = 0, cur = 0, tick = 0;
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, "");
const CH = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const cho = s => [...s.replace(/[A-Za-z]+/g, w => w[0] + "○".repeat(w.length - 1))].map(c => { const n = c.charCodeAt(0) - 44032; return n >= 0 && n < 11172 ? CH[n / 588 | 0] : c; }).join("");
const mainHtml = h => { clearInterval(tick); $("#main").innerHTML = h; };
async function getQs(no, step) { return need(await sb.rpc("get_questions", { p_lesson: no, p_step: step })) || []; }

function sideHtml() {
  const by = {}; lessons.forEach(l => (by[l.unit] = by[l.unit] || []).push(l));
  return Object.keys(by).map(u => {
    const a = by[u], d = a.filter(l => prog[l.lesson_no]).length;
    return `<button class="un" onclick="openU=${openU == u ? 0 : u};drawSide()"><span>${u}. ${UN[u - 1] || "단원"}</span><small>${Math.round(100 * d / a.length)}%</small></button>` +
      (openU == u ? a.map(l => `<button class="sub ${l.lesson_no == cur ? "cur" : ""}" onclick="go(${l.lesson_no})"><span>${l.lesson_no}. ${esc(l.title)}</span>${prog[l.lesson_no] ? "<b>학습완료</b>" : ""}</button>`).join("") + (REVIEW.includes(+u) ? `<button class="sub rvb" onclick="reviewIntro(${u})"><span>📝 Review Test</span></button>` : "") : "");
  }).join("");
}
let REVIEW = []; /* Review Test 문제가 있는 단원 (서버에서 자동으로 불러와요) */
const drawSide = () => { $(".side").innerHTML = sideHtml(); };

async function lessonView() {
  setLock(true);
  try { const ru = await sb.rpc("get_review_units"); REVIEW = (ru.data || []).map(x => +x.unit); } catch (e) {}
  const r = await sb.from("progress").select("lesson_no,completed_at").eq("student_id", me.id);
  prog = {}; (r.data || []).forEach(p => { if (p.completed_at) prog[p.lesson_no] = true; });
  const nx = lessons.find(l => !prog[l.lesson_no]) || lessons[0];
  if (!nx) return html(hdr() + `<div class="card">강의가 아직 없어요.</div>`);
  html(hdr() + `<div class="lay"><div class="side"></div><div id="main"></div></div>`);
  go(nx.lesson_no);
}

const vid = L => `<div class="card"><div class="muted">${L.lesson_no}강 · ${esc(UN[L.unit - 1] || "")}</div><h2>${esc(L.title)}</h2>
  <div class="vwrap" id="vw"><iframe src="${esc(L.embed_url)}" allow="autoplay; fullscreen" allowfullscreen title="강의 영상"></iframe>
  <div class="vbar"><button class="btn ghost" id="fs">전체화면</button><button class="btn" id="seen">다 봤어요</button></div></div><p class="muted" style="margin:10px 2px 0">영상이 재생되지 않으면 <a href="${esc(L.embed_url.replace("/preview","/view"))}" target="_blank" rel="noopener">새 창에서 열기</a>를 눌러 보세요. 영상을 다 본 뒤에는 이 화면으로 돌아와 “다 봤어요”를 누르세요.</p></div>`;

function wire(no) {
  $("#fs").onclick = () => { document.fullscreenElement ? document.exitFullscreen() : $("#vw").requestFullscreen(); };
  $("#seen").onclick = async () => { need(await sb.rpc("save_progress", { p_lesson: no, p_step: "video" })); noteStep(no); };
}

function go(no) {
  cur = no; const L = lessons.find(x => x.lesson_no == no); openU = L.unit; drawSide();
  mainHtml((prog[no] ? `<p class="ok">학습완료한 강의예요. 다시 학습할 수 있어요.</p>` : "") + vid(L));
  wire(no); window.scrollTo(0, 0);
}

async function noteStep(no) {
  const { data } = await sb.from("notes").select("body").eq("lesson_no", no).maybeSingle();
  if (!data) return typeStep(no);
  const it = [];
  const body = data.body.split(/\{\{(.*?)\}\}/).map((t, k) => {
    if (k % 2 == 0) return esc(t).replace(/\n/g, "<br>");
    const i = it.push({ a: t.trim(), t0: 0, th: 0, ok: 0 }) - 1;
    return `<span class="bl"><input data-i="${i}" size="${Math.max(4, t.trim().length + 1)}" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="hint" data-h="${i}" disabled>힌트(10)</button><span class="ans" id="x${i}"></span></span>`;
  }).join("");
  mainHtml(`<div class="card"><div class="muted">요점정리노트 · 괄호를 채워 보세요</div><div class="note">${body}</div><button class="btn" id="nxt" disabled>다음: 문장 입력하기</button></div>`);
  const hs = document.querySelectorAll(".hint");
  document.querySelectorAll(".bl input").forEach(el => {
    const i = el.dataset.i, x = it[i];
    el.onfocus = () => { if (!x.t0) x.t0 = Date.now(); };
    el.oninput = () => {
      if (norm(el.value) !== norm(x.a)) return;
      x.ok = 1; el.classList.add("good"); el.disabled = true; $("#x" + i).textContent = ""; hs[i].hidden = true;
      if (it.every(y => y.ok)) $("#nxt").disabled = false;
    };
  });
  hs.forEach(b => b.onclick = () => {
    const x = it[b.dataset.h], o = $("#x" + b.dataset.h);
    if (!x.th) { x.th = Date.now(); o.textContent = "초성: " + cho(x.a); }
    else { o.textContent = "정답: " + x.a; b.hidden = true; }
  });
  tick = setInterval(() => {
    const now = Date.now();
    it.forEach((x, i) => {
      const b = hs[i]; if (x.ok || b.hidden) return;
      if (!x.th) { const s = x.t0 ? 10 - Math.floor((now - x.t0) / 1000) : 10; b.disabled = s > 0; b.textContent = s > 0 ? `힌트(${s})` : "힌트보기"; }
      else { const s = 10 - Math.floor((now - x.th) / 1000); b.disabled = s > 0; b.textContent = s > 0 ? `정답보기(${s})` : "정답보기"; }
    });
  }, 500);
  $("#nxt").onclick = () => typeStep(no);
}

let board = [];
let _ac = null;
function ding() {
  try {
    _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = _ac.createOscillator(), g = _ac.createGain(), t = _ac.currentTime;
    o.type = "sine"; o.frequency.value = 330; o.connect(g); g.connect(_ac.destination);
    g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.start(t); o.stop(t + 0.26);
  } catch (e) {}
}
let qboard = [];
async function loadBoard() {
  const [a, b] = await Promise.all([sb.rpc("get_leaderboard"), sb.rpc("get_quiz_leaderboard")]);
  board = a.data || []; qboard = b.data || [];
}
const rkHtml = () => boardHtml() + qBoardHtml();
function qBoardHtml() {
  const m = new Date().getMonth() + 1, top = qboard.slice(0, 5), mine = qboard.find(x => x.is_me);
  const row = (x, extra) => `<div class="rkr ${x.is_me ? "me" : ""}"><span>${x.place}</span><span class="nm">${esc(x.name)}${extra || ""}</span><b>${x.correct}</b></div>`;
  return `<div class="rk"><b>🎯 ${m}월 퀴즈왕</b>${top.map(x => row(x)).join("") || `<div class="muted">아직 기록이 없어요</div>`}
    ${mine && mine.place > 5 ? `<div class="muted" style="text-align:center">⋮</div>` + row(mine, " (나)") : ""}
    <button class="link" onclick="qBoardAll()">더보기</button></div>`;
}
function qBoardAll() {
  const m = new Date().getMonth() + 1, d = document.createElement("div"); d.className = "modal";
  d.innerHTML = `<div class="box"><b>🎯 ${m}월 퀴즈 순위</b> <span class="muted">(맞힌 문제 수 · 매달 1일에 새로 시작해요)</span>
    ${qboard.map(x => `<div class="rkr ${x.is_me ? "me" : ""}"><span>${x.place}</span><span class="nm">${esc(x.name)}</span><b>${x.correct}문제</b></div>`).join("") || `<div class="muted">아직 기록이 없어요</div>`}
    <button class="btn" id="cl">닫기</button></div>`;
  d.onclick = e => { if (e.target === d) d.remove(); };
  document.body.appendChild(d); d.querySelector("#cl").onclick = () => d.remove();
}
function boardHtml() {
  const m = new Date().getMonth() + 1, top = board.slice(0, 5), mine = board.find(x => x.is_me);
  const row = (x, extra) => `<div class="rkr ${x.is_me ? "me" : ""}"><span>${x.place}</span><span class="nm">${esc(x.name)}${extra || ""}</span><b>${x.sentences}</b></div>`;

function boardAll() {
  const m = new Date().getMonth() + 1, d = document.createElement("div"); d.className = "modal";
  d.innerHTML = `<div class="box"><b>🏆 ${m}월 문장 순위</b> <span class="muted">(매달 1일에 새로 시작해요)</span>

function setMine(n) {
  const m = board.find(x => x.is_me); if (!m) return;
  m.sentences = n;
  board.sort((a, b) => b.sentences - a.sentences || a.name.localeCompare(b.name));
  let p = 0, last = -1, idx = 0; board.forEach(x => { idx++; if (x.sentences !== last) { p = idx; last = x.sentences; } x.place = p; });
  const box = document.querySelector(".rkbox"); if (box) box.innerHTML = rkHtml();
}
function scramble(ans) {
  const w = ans.replace(/[.?!]+$/, "").split(" ");
  let r = shuffle([...w]); for (let t = 0; t < 6 && w.length > 1 && r.join(" ") === w.join(" "); t++) r = shuffle([...w]);
  return r;
}

async function typeStep(no) {
  const sents = need(await sb.rpc("get_sentences", { p_lesson: no })) || [];
  if (!sents.length) return quizStep(no);
  const PAGE = 20, pages = Math.ceil(sents.length / PAGE);
  await loadBoard();

  const showPage = pg => {
    const items = sents.slice(pg * PAGE, pg * PAGE + PAGE); let done = 0;
    mainHtml(`<div class="tw"><div class="card"><div class="muted">어순 맞춰 입력하기 · ${pg + 1}쪽 / ${pages}쪽 (총 ${sents.length}문장)</div>
      <p class="muted" style="margin:6px 0">단어를 보고 알맞은 순서로 문장을 입력해요. 틀리면 작게 '띵' 소리가 나요. <b><span id="cnt">0</span> / ${items.length}</b></p>
      ${items.map((x, i) => `<div class="srow" id="r${i}"><div class="ko">${i + 1}. ${esc(x.prompt)}</div>
        <div class="pool">${scramble(x.answer).map(w => `<span class="chip">${esc(w)}</span>`).join("")}</div>
        <div class="mir" id="m${i}"></div>
        <input class="sin" id="in${i}" placeholder="여기에 입력하세요" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <span class="tick">✔</span></div>`).join("")}
      <button class="btn" id="fin" disabled>다 했어요</button></div>
      <div class="rkbox">${rkHtml()}</div></div>`);
    const first = $("#in0"); if (first) first.focus();
    items.forEach((x, i) => {
      const T = x.answer.trim(), body = T.replace(/[.?!]+$/, "");
      const inp = $("#in" + i), mir = $("#m" + i), row = $("#r" + i); let fin = false;
      const eq = (a, b) => a.replace(/[’‘]/g, "'").toLowerCase() === b.toLowerCase();
      const chips = [...row.querySelectorAll(".chip")], ws = body.split(" "); let c = 0;
      const ends = ws.map(w => (c += w.length, c++ , c - 1));
      const grey = j => {
        chips.forEach(ch => ch.classList.remove("used"));
        ws.forEach((w, k) => {
          if (j < ends[k]) return;
          const free = chips.filter(h => !h.classList.contains("used"));
          const ch = free.find(h => h.textContent === w) || free.find(h => h.textContent.toLowerCase() === w.toLowerCase());
          if (ch) ch.classList.add("used");
        });
      };
      inp.oninput = () => {
        if (fin) return;
        const v = inp.value; let j = 0;
        while (j < v.length && j < body.length && eq(v[j], body[j])) j++;
        if (j < v.length) ding();
        inp.value = body.slice(0, j); mir.textContent = body.slice(0, j); grey(j);
        if (j === body.length) {
          fin = true; mir.textContent = T; inp.value = T; inp.disabled = true; row.classList.add("ok"); done++;
          $("#cnt").textContent = done;
          sb.rpc("record_sentence", { p_question: x.id }).then(r => { if (typeof r.data === "number" && r.data >= 0) setMine(r.data); });
          const nx = $("#in" + (i + 1));
          if (nx) { nx.focus(); nx.scrollIntoView({ block: "center", behavior: "smooth" }); }
          if (done === items.length) { $("#fin").disabled = false; $("#fin").scrollIntoView({ block: "center", behavior: "smooth" }); }
        }
      };
    });
    $("#fin").onclick = () => afterPage(pg);
  };

  const afterPage = pg => {
    const has = pg + 1 < pages;
    mainHtml(`<div class="tw"><div class="card"><h2>${pg + 1}쪽 완료! 👏</h2>
      <p>${Math.min((pg + 1) * PAGE, sents.length)}문장을 입력했어요.</p>
      ${has ? `<p class="muted">더 연습하면 순위가 올라가요. 문장 연습은 선택이에요.</p><button class="btn" id="more">다른 문장 연습하기</button>`
            : `<p class="ok">${sents.length}문장을 모두 입력했어요! 정말 대단해요 🎉</p>`}
      <button class="btn ${has ? "ghost" : ""}" id="quiz">문제 풀러 가기</button></div>
      <div class="rkbox">${rkHtml()}</div></div>`);
    if (has) $("#more").onclick = () => showPage(pg + 1);
    $("#quiz").onclick = () => quizStep(no);
  };
  showPage(0);
}

async function quizStep(no) {
  const qs = shuffle(await getQs(no, "quiz")).slice(0, 10); let i = 0, right = 0; const wrong = [];
  const review = () => {
    mainHtml(`<div class="card"><h2>틀린 문제 풀이</h2><p class="muted">${qs.length}문제 중 ${right}개 맞았어요. 틀린 문제를 확인해 보세요.</p>
      ${wrong.map((w, k) => `<div class="rv"><p class="q">${k + 1}. ${esc(w.p)}</p><p class="no">내 답: ${esc(w.mine)}</p><p class="ok">정답: ${esc(w.ans)}</p>${w.exp ? `<div class="exp">💡 ${esc(w.exp)}</div>` : ""}</div>`).join("")}
      <button class="btn" id="done">학습 완료하기</button></div>`);
    $("#done").onclick = () => finish(no, right, qs.length);
  };
  const show = () => {
    if (i >= qs.length) return wrong.length ? review() : finish(no, right, qs.length);
    const q = qs[i];
    mainHtml(`<div class="card"><div class="muted">퀴즈 · ${i + 1} / ${qs.length}</div><p class="q">${esc(q.prompt)}</p>
      ${shuffle([...(q.choices || [])]).map((c, k) => `<button class="choice" data-c="${esc(c)}">${"①②③④⑤"[k]} ${esc(c)}</button>`).join("")}<div id="fb"></div></div>`);
    const all = document.querySelectorAll(".choice");
    all.forEach(b => b.onclick = async () => {
      all.forEach(x => x.disabled = true);
      const d = need(await sb.rpc("submit_answer", { p_question: q.id, p_answer: b.dataset.c }));
      if (!d) { all.forEach(x => x.disabled = false); return; }
      const r = d[0];
      if (r.is_correct) right++; else wrong.push({ p: q.prompt, mine: b.dataset.c, ans: r.correct_answer, exp: r.explanation });
      all.forEach(x => { if (x.dataset.c === r.correct_answer) x.style.borderColor = "var(--ok)"; });
      if (!r.is_correct) b.style.borderColor = "var(--no)";
      $("#fb").innerHTML = `<p class="${r.is_correct ? "ok" : "no"}">${r.is_correct ? "정답이에요! 👍" : "아쉬워요. 정답: " + esc(r.correct_answer)}</p>
        ${!r.is_correct && r.explanation ? `<div class="exp">💡 풀이: ${esc(r.explanation)}</div>` : ""}
        <button class="btn" id="nx">${i + 1 < qs.length ? "다음 문제" : (wrong.length ? "틀린 문제 풀이 보기" : "결과 보기")}</button>`;
      $("#nx").onclick = () => { i++; show(); };
    });
  };
  show();
}

let NB = [], nbTab = "open", nbSort = "recent", nbUnit = 0;
async function notebook() {

const nbDate = s => s ? new Date(s).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" }) : "";
const nbKind = x => x.src === "review" ? "Review Test" : x.step === "order" ? "어순 배열" : "퀴즈";
function nbCard(x) {
  return `<div class="card nbq"><div class="tag">${x.lesson_no ? x.lesson_no + "강 · " : ""}${nbKind(x)} · 틀린 횟수 ${x.wrong_count}번 · 마지막 ${nbDate(x.last_at)}${x.solved ? ` · <span class="done">✔ 해결</span>` : ""}</div>

function nbDraw() {
  const open = NB.filter(x => !x.solved), done = NB.filter(x => x.solved), list = nbTab === "open" ? open : done;
  const tabs = `<div class="nbt"><button class="btn ${nbTab === "open" ? "" : "ghost"}" onclick="nbTab='open';nbUnit=0;nbDraw()">아직 못 맞힌 문제 (${open.length})</button><button class="btn ${nbTab === "done" ? "" : "ghost"}" onclick="nbTab='done';nbUnit=0;nbDraw()">해결한 문제 (${done.length})</button></div>`;
  let body = "";
  if (!nbUnit) {
    const by = {}; list.forEach(x => { const u = x.unit || 0; by[u] = (by[u] || 0) + 1; });
    const us = Object.keys(by).map(Number).sort((a, b) => a - b);
    body = us.length ? `<p class="muted">단원을 눌러 문제를 다시 확인해요.</p>` + us.map(u => `<button class="choice" onclick="nbUnit=${u};nbDraw()"><b>${u ? u + ". " + esc(UN[u - 1] || "단원") : "기타"}</b> · ${by[u]}문제</button>`).join("")
      : `<div class="card">${nbTab === "open" ? "틀린 문제가 없어요. 대단해요! 👏" : "아직 해결한 문제가 없어요."}</div>`;
  } else {
    const items = list.filter(x => (x.unit || 0) === nbUnit);
    const srt = [...items].sort(nbSort === "recent" ? (a, b) => new Date(b.last_at) - new Date(a.last_at) : (a, b) => (a.lesson_no || 0) - (b.lesson_no || 0) || new Date(b.last_at) - new Date(a.last_at));
    let cards = "";
    if (nbSort === "lesson") { let last = -1; srt.forEach(x => { if (x.lesson_no !== last) { last = x.lesson_no; cards += `<div class="lh">${x.lesson_no ? x.lesson_no + "강" : "기타"}</div>`; } cards += nbCard(x); }); }
    else cards = srt.map(nbCard).join("");
    const canRetry = nbTab === "open" && items.some(x => x.src === "quiz" && x.step === "quiz");
    body = `<button class="link" onclick="nbUnit=0;nbDraw()">← 단원 목록</button><h3>${nbUnit}. ${esc(UN[nbUnit - 1] || "")} · ${items.length}문제</h3>
      <div class="nbt"><button class="btn ${nbSort === "recent" ? "" : "ghost"}" onclick="nbSort='recent';nbDraw()">최근 틀린 순</button><button class="btn ${nbSort === "lesson" ? "" : "ghost"}" onclick="nbSort='lesson';nbDraw()">강의 번호순</button></div>

  }

}

      <input id="nl" placeholder="아이디 (영문 소문자·숫자)" autocapitalize="none">
      <input id="np" placeholder="비밀번호 (6자 이상)">
      <input id="nn" placeholder="이름"></div>
      <button class="btn" id="add">학생 만들기</button></div>`);
  $("#add").onclick = async () => {
    const l = $("#nl").value, p = $("#np").value, n = $("#nn").value.trim();
    if (!l || !p || !n) return alert("아이디, 비밀번호, 이름을 모두 입력하세요.");
    const d = need(await sb.rpc("admin_create_student", { p_login: l, p_password: p, p_name: n }));
    if (d) { alert(d + "\n아이디: " + l.toLowerCase() + "\n비밀번호: " + p); adminView(); }
  };
}

async function detail(i) {
  const s = R[i];
  const d = need(await sb.rpc("admin_lesson_stats", { p_student: s.student_id })) || [];
  $("#det").innerHTML = `<h2 style="margin-top:20px">${esc(s.name)} · 강의별 결과</h2><div class="scroll"><table>
    <thead><tr><th>강</th><th>제목</th><th>푼 문제</th><th>정답</th><th>정답률</th><th>완료</th></tr></thead><tbody>
    ${d.map(x => `<tr><td>${x.lesson_no}</td><td style="white-space:normal">${esc(x.title)}</td><td>${x.attempts}</td><td>${x.correct}</td>
      <td>${x.attempts ? Math.round(100 * x.correct / x.attempts) + "%" : "-"}</td><td>${fmt(x.completed_at)}</td></tr>`).join("") || `<tr><td colspan="6">아직 학습 기록이 없어요.</td></tr>`}
    </tbody></table></div>`;
}

async function resetPw(i) {
  const s = R[i], p = prompt(s.name + " 학생의 새 비밀번호 (6자 이상)");
  if (!p) return;
  const d = need(await sb.rpc("admin_reset_password", { p_student: s.student_id, p_password: p }));
  if (d) alert(d + "\n새 비밀번호: " + p);
}

async function toggle(i) {
  const s = R[i];
  if (!confirm(s.name + " 학생을 " + (s.active ? "사용 중지" : "다시 사용") + "할까요?")) return;
  need(await sb.rpc("admin_set_active", { p_student: s.student_id, p_active: !s.active }));
  adminView();
}

init();
</script>
</body>
</html>
